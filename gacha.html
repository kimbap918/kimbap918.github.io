<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>라테일 확률형 상자 기대값 계산기</title>
<style>

:root{color-scheme:light dark;--bg:#0f1115;--panel:#171a21;--border:#2a2f3a;--text:#e6e8ee;--muted:#9aa3b2;--accent:#6ea8ff;--best:#e8b93a;--box-orange:#ff9d3d;--mythic-purple:#c48aff;}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f8;--panel:#ffffff;--border:#dde1e8;--text:#1b1f27;--muted:#5b6472;--accent:#2f6fed;--best:#a8790a;--box-orange:#c2600a;--mythic-purple:#6b2fa0;}}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--text);}
header{padding:16px 20px;border-bottom:1px solid var(--border);}
h1{font-size:18px;margin:0 0 6px;}
.updateDate{font-size:11px;color:var(--muted);font-weight:normal;margin-left:8px;}
.lead{font-size:12px;color:var(--muted);margin:0 0 10px;}
select{padding:8px 12px;font-size:14px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);max-width:420px;width:100%;}
#main{padding:16px 20px;max-width:920px;margin:0 auto;}
h2{font-size:15px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:26px;}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px;}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;}
th{color:var(--muted);font-weight:600;}
.mono{font-variant-numeric:tabular-nums;}
tr.reward-row{cursor:pointer;}
tr.reward-row:hover{background:var(--panel);}
tr.reward-row.selected{outline:2px solid var(--accent);outline-offset:-2px;}
tr.reward-row.best td{color:var(--best);}
.badge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--best);color:#000;}
.small{color:var(--muted);font-size:12px;}
.calc-box{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-top:10px;background:var(--panel);}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:8px;}
.calc-grid .k{color:var(--muted);}
.calc-grid .v{font-weight:600;font-variant-numeric:tabular-nums;}
.n-presets{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;}
.n-presets button{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;}
.n-presets button.active{border-color:var(--accent);color:var(--accent);}
.n-presets input{width:70px;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
.mode-tabs{display:flex;gap:8px;margin-top:4px;}
.mode-tab{padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;}
.mode-tab:hover{border-color:var(--accent);}
.mode-tab.active{background:var(--accent);color:#10151d;font-weight:bold;border-color:var(--accent);}
.mythic-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--border);}
.mythic-tab{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap;}
.mythic-tab:hover{border-color:var(--accent);}
.mythic-tab.active{background:var(--accent);color:#10151d;font-weight:bold;}
.mythic-item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px;}
.mythic-item-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;font-size:11px;}
.mythic-item-card.mythic{border-color:var(--best);background:rgba(232,185,58,0.08);}
.mythic-item-card img{width:32px;height:32px;image-rendering:pixelated;}
.mythic-item-card .name{margin-top:4px;font-size:10px;line-height:1.3;min-height:2.6em;}
.mythic-item-card .pct{margin-top:2px;color:var(--muted);}
.run-btn{background:var(--accent) !important;color:#10151d !important;border-color:var(--accent) !important;font-weight:bold;}
.reset-btn{color:var(--muted);}
.n-presets button:disabled{opacity:0.5;cursor:default;}
.stat-orange{color:var(--box-orange);}
.stat-purple{color:var(--mythic-purple);}
.mythic-log{margin-top:12px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;min-height:32px;max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;}
.mythic-log-entry{font-size:12px;font-variant-numeric:tabular-nums;}
.mythic-log-entry.box{color:var(--box-orange);}
.mythic-log-entry.mythic{color:var(--mythic-purple);font-weight:bold;}
.mythic-log-empty{color:var(--muted);}
.mythic-item-card{cursor:pointer;position:relative;}
.mythic-item-card:hover{border-color:var(--accent);}
.mythic-item-card.owned-box{border-color:var(--mythic-purple);box-shadow:0 0 0 1px var(--mythic-purple);}
.mythic-item-card.obtained{border-color:var(--mythic-purple);box-shadow:0 0 0 1px var(--mythic-purple);}
.mythic-item-card .owned-badge{position:absolute;top:4px;right:4px;font-size:9px;background:var(--mythic-purple);color:#fff;border-radius:999px;padding:1px 5px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal-overlay.hidden{display:none;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-box h3{margin:0 0 10px;font-size:15px;}
.modal-box .modal-icon-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.modal-box .modal-icon-row img{width:40px;height:40px;image-rendering:pixelated;}
.modal-box .modal-desc{white-space:pre-line;font-size:13px;color:var(--text);margin:8px 0;}
.modal-box .modal-stats{margin:10px 0;font-size:12px;}
.modal-box .modal-stats div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.modal-actions button{padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;}
.modal-actions button.confirm{background:var(--accent);color:#10151d;border-color:var(--accent);font-weight:bold;}
.easter-egg{margin:10px 0 0;padding:8px 10px;border-radius:6px;background:var(--accent-soft, rgba(110,168,255,0.12));font-size:12px;}
.easter-egg a{color:var(--accent);font-weight:bold;text-decoration:underline;cursor:pointer;}
@keyframes mythicFlash{
  0%{box-shadow:0 0 0 1px var(--mythic-purple);transform:scale(1);}
  25%{box-shadow:0 0 0 2px var(--mythic-purple),0 0 26px 8px var(--mythic-purple);transform:scale(1.08);}
  100%{box-shadow:0 0 0 1px var(--mythic-purple);transform:scale(1);}
}
.mythic-item-card.flash{animation:mythicFlash 1.3s ease-out;z-index:2;}
.mythic-item-card.flash .name{color:var(--mythic-purple);font-weight:bold;}
@media (prefers-reduced-motion:reduce){.mythic-item-card.flash{animation:none;box-shadow:0 0 0 2px var(--mythic-purple);}}
@keyframes mythicShimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
.mythic-shine{
  background:linear-gradient(90deg,var(--mythic-purple) 0%,#f2e6ff 50%,var(--mythic-purple) 100%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  color:var(--mythic-purple);font-weight:bold;animation:mythicShimmer 2.2s linear infinite;
}
@media (prefers-reduced-motion:reduce){.mythic-shine{animation:none;-webkit-text-fill-color:var(--mythic-purple);background:none;}}
@keyframes mythicGlow{
  0%,100%{box-shadow:0 0 0 1px var(--mythic-purple),0 0 18px 4px rgba(196,138,255,0.35);}
  50%{box-shadow:0 0 0 2px var(--mythic-purple),0 0 34px 10px rgba(196,138,255,0.6);}
}
.modal-box.mythic-glow{border-color:var(--mythic-purple);animation:mythicGlow 1.8s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){.modal-box.mythic-glow{animation:none;box-shadow:0 0 0 2px var(--mythic-purple),0 0 24px 6px rgba(196,138,255,0.45);}}
.mythic-log-entry.royal{color:var(--best);font-weight:bold;}
@keyframes goldFlash{
  0%{box-shadow:0 0 0 1px var(--best);transform:scale(1);}
  25%{box-shadow:0 0 0 2px var(--best),0 0 26px 8px var(--best);transform:scale(1.08);}
  100%{box-shadow:0 0 0 1px var(--best);transform:scale(1);}
}
.mythic-item-card.flash-gold{animation:goldFlash 1.3s ease-out;z-index:2;}
.mythic-item-card.flash-gold .name{color:var(--best);font-weight:bold;}
@media (prefers-reduced-motion:reduce){.mythic-item-card.flash-gold{animation:none;box-shadow:0 0 0 2px var(--best);}}
@keyframes goldShimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
.gold-shine{
  background:linear-gradient(90deg,var(--best) 0%,#fff6d9 50%,var(--best) 100%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  color:var(--best);font-weight:bold;animation:goldShimmer 2.2s linear infinite;
}
@media (prefers-reduced-motion:reduce){.gold-shine{animation:none;-webkit-text-fill-color:var(--best);background:none;}}
@keyframes goldGlow{
  0%,100%{box-shadow:0 0 0 1px var(--best),0 0 18px 4px rgba(232,185,58,0.35);}
  50%{box-shadow:0 0 0 2px var(--best),0 0 34px 10px rgba(232,185,58,0.6);}
}
.modal-box.gold-glow{border-color:var(--best);animation:goldGlow 1.8s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){.modal-box.gold-glow{animation:none;box-shadow:0 0 0 2px var(--best),0 0 24px 6px rgba(232,185,58,0.45);}}
.mythic-item-card.royal-selected{outline:2px solid var(--accent);outline-offset:-2px;}
@media (max-width:720px){
  #main{padding:14px;}
  .calc-grid{grid-template-columns:1fr;}
  table{font-size:12px;}
}

</style>
</head>

  <header>
    <h1>확률형 상자 기대값 계산기 <span class="updateDate">최근 업데이트 2026.08.19</span></h1>

  <main id="main"></main>
</div>

<script>

const DATA = JSON.parse(document.getElementById('game-data').textContent);
const boxes = DATA.boxes;
const boxSelect = document.getElementById('boxSelect');
const main = document.getElementById('main');

// ---------- 공용 모달 ----------
const modalOverlay = document.getElementById('modalOverlay');
const modalBox = document.getElementById('modalBox');
let pendingModalContinue = null; // 신화 아이템 획득 모달처럼, 어떻게 닫히든(버튼/바깥클릭) 반드시 재개돼야 하는 콜백
function showModal(html, extraClass) {
  modalBox.className = 'modal-box' + (extraClass ? ' ' + extraClass : '');
  modalBox.innerHTML = html;
  modalOverlay.classList.remove('hidden');
}
function hideModal() {
  modalOverlay.classList.add('hidden');
  modalBox.innerHTML = '';
  if (pendingModalContinue) {
    const cb = pendingModalContinue;
    pendingModalContinue = null;
    cb();
  }
}
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) hideModal(); });

boxes.forEach((b, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = b.title;
  boxSelect.appendChild(opt);
});

let target = { kind: 'row', idx: 0 };
let sampleN = 10;

function pct(prob) { return (prob / 100).toFixed(2); }

function cheapestTier(box, key) {
  return box.priceTiers.reduce((best, t) => (t[key] / t.n < best[key] / best.n ? t : best));
}

function bestAggregateProb(box) {
  return box.rewards.filter(r => r.best).reduce((s, r) => s + r.prob, 0);
}

function targetProb(box) {
  if (target.kind === 'best') return bestAggregateProb(box);
  return box.rewards[target.idx].prob;
}
function targetName(box) {
  if (target.kind === 'best') return '탑급(TOP) 아이템 중 아무거나 하나';
  return box.rewards[target.idx].name;
}

function fmtWon(n) {
  return Math.round(n).toLocaleString('ko-KR') + '원';
}

function render() {
  const box = boxes[boxSelect.value];
  if (target.kind === 'row' && !box.rewards[target.idx]) target = { kind: 'row', idx: 0 };

  let out = '';

  out += '<h2>구성 아이템 <span class="small">(카드를 클릭하면 아래 계산기 대상이 바뀝니다)</span></h2>';
  out += '<div class="mythic-item-grid" id="royalItemGrid"></div>';

  if (box.exchangeEnabled) {
    out += '<h2>교환 · 보유 아이템 <span class="small">(뽑기로 획득한 의상 선택권을 교환해서 실제로 뭘 뽑았는지 모아볼 수 있습니다)</span></h2>';
    out += '<div class="calc-box" id="royalExchangeBox"></div>';
  }

  const bestSum = bestAggregateProb(box);
  if (bestSum > 0) {
    const selected = target.kind === 'best';
    out += '<div class="n-presets" style="margin-top:8px;"><button id="royalBestTargetBtn" class="' + (selected ? 'active' : '') + '">탑급(TOP) 아이템 중 아무거나 하나 <span class="mono">(' + pct(bestSum) + '%)</span></button></div>';
  }

  out += '<h2>뽑기 시뮬레이터</h2>';
  out += '<div class="calc-box" id="royalSimBox"></div>';

  out += '<h2>가격 (묶음 구매)</h2>';
  const perPullSaleList = box.priceTiers.map(t => t.sale / t.n);
  const linear = perPullSaleList.every(v => Math.abs(v - perPullSaleList[0]) < 0.01);
  out += '<table><thead><tr><th>묶음</th><th>정가</th><th>할인가</th><th>개당 단가(할인가)</th></tr></thead><tbody>';
  box.priceTiers.forEach(t => {
    out += '<tr><td>' + t.n + '회</td><td class="mono">' + fmtWon(t.cash) + '</td><td class="mono">' + fmtWon(t.sale) + '</td><td class="mono">' + fmtWon(t.sale / t.n) + '</td></tr>';
  });
  out += '</tbody></table>';
  out += '<p class="small">' + (linear ? '모든 묶음의 개당 단가가 동일합니다 - 대량 구매해도 추가 할인은 없습니다.' : '묶음이 클수록 개당 단가가 달라집니다 - 표에서 가장 저렴한 묶음을 골라 아래 계산에 반영했습니다.') + '</p>';

  const p = targetProb(box) / 10000;
  const expectedPulls = 1 / p;
  const saleTier = cheapestTier(box, 'sale');
  const cashTier = cheapestTier(box, 'cash');
  const cheapSale = saleTier.sale / saleTier.n;
  const cheapCash = cashTier.cash / cashTier.n;
  const hitProb = 1 - Math.pow(1 - p, sampleN);

  out += '<h2>기대값 계산기</h2>';
  out += '<div class="calc-box">';
  out += '<div style="display:flex;align-items:center;gap:8px;">';
  if (target.kind !== 'best' && box.rewards[target.idx].icon) {
    out += '<img src="' + box.rewards[target.idx].icon + '" alt="" style="width:28px;height:28px;image-rendering:pixelated;flex:0 0 auto;">';
  }
  out += '<div><strong>대상:</strong> ' + targetName(box) + ' <span class="small mono">(개별 확률 ' + (target.kind === 'best' ? pct(bestSum) : pct(box.rewards[target.idx].prob)) + '%)</span>';
  if (target.kind !== 'best') {
    const hasChoices = box.rewards[target.idx].choices && box.rewards[target.idx].choices.length;
    out += ' <a href="#" id="royalTargetDetailLink" class="small" style="color:var(--accent);">' + (hasChoices ? '교환 목록 보기' : '설명 보기') + '</a>';
  }
  out += '</div>';
  out += '</div>';
  out += '<div class="calc-grid">';
  out += '<div class="k">기대 뽑기 횟수(평균)</div><div class="v">' + expectedPulls.toFixed(1) + '회</div>';
  out += '<div class="k">적용 단가(할인가, 1회당)</div><div class="v">' + fmtWon(cheapSale) + ' <span class="small">(' + saleTier.n + '회 묶음 기준)</span></div>';
  out += '<div class="k">기대 비용(할인가 기준)</div><div class="v">' + fmtWon(expectedPulls * cheapSale) + '</div>';
  out += '<div class="k">적용 단가(정가, 1회당)</div><div class="v">' + fmtWon(cheapCash) + ' <span class="small">(' + cashTier.n + '회 묶음 기준)</span></div>';
  out += '<div class="k">기대 비용(정가 기준)</div><div class="v">' + fmtWon(expectedPulls * cheapCash) + '</div>';
  out += '<div class="k">' + sampleN + '회 실제 소비 금액(할인가)</div><div class="v">' + fmtWon(sampleN * cheapSale) + '</div>';
  out += '<div class="k">' + sampleN + '회 실제 소비 금액(정가)</div><div class="v">' + fmtWon(sampleN * cheapCash) + '</div>';
  out += '<div class="k">' + sampleN + '회 뽑을 때 1개 이상 나올 확률</div><div class="v">' + (hitProb * 100).toFixed(2) + '%</div>';
  out += '</div>';
  out += '<div class="n-presets">';
  [1, 5, 10, 30, 50, 100].forEach(n => {
    out += '<button data-n="' + n + '" class="' + (sampleN === n ? 'active' : '') + '">' + n + '회</button>';
  });
  out += '<input type="number" id="nInput" min="1" value="' + sampleN + '">';
  out += '</div>';
  out += '<p class="small">기대 비용은 평균값입니다 - 확률형 상자는 결과가 매번 랜덤이라 실제로 그보다 훨씬 적게/많이 쓸 수 있습니다.</p>';
  out += '</div>';

  if (box.trade.length) {
    const royalPoints = getRoyalCumulative(box).royalPoints || 0;
    out += '<h2>포인트 교환</h2>';
    out += '<p class="small">뽑을 때마다 1P씩 쌓이는 포인트(보너스 뽑기 제외)로 교환 가능한 확정 보상입니다 - 위 뽑기 시뮬레이터의 누적 로얄 포인트: <strong class="mono">' + royalPoints.toLocaleString('ko-KR') + 'P</strong></p>';
    out += '<table><thead><tr><th>교환 아이템</th><th>수량</th><th>필요 포인트</th><th></th></tr></thead><tbody>';
    box.trade.forEach(t => {
      const affordable = royalPoints >= t.points;
      out += '<tr><td>' + t.name + '</td><td>' + t.count + '</td><td class="mono">' + t.points.toLocaleString('ko-KR') + 'P</td>' +
        '<td>' + (affordable ? '<span class="badge">교환 가능</span>' : '') + '</td></tr>';
    });
    out += '</tbody></table>';
  }

  main.innerHTML = out;

  renderRoyalItemGrid(box);
  if (box.exchangeEnabled) refreshExchangeBox(box);

  const bestTargetBtn = document.getElementById('royalBestTargetBtn');
  if (bestTargetBtn) bestTargetBtn.onclick = () => { target = { kind: 'best' }; render(); };

  const detailLink = document.getElementById('royalTargetDetailLink');
  if (detailLink) {
    detailLink.onclick = (e) => { e.preventDefault(); showItemDetail(box.rewards[target.idx]); };
  }

  main.querySelectorAll('.n-presets button[data-n]').forEach(btn => {
    btn.onclick = () => { sampleN = parseInt(btn.dataset.n, 10); render(); };
  });
  const nInput = document.getElementById('nInput');
  if (nInput) {
    nInput.onchange = () => {
      const v = parseInt(nInput.value, 10);
      if (v > 0) { sampleN = v; render(); }
    };
  }

  renderRoyalSim(box);
}

function royalItemCard(r, idx, extraClass) {
  let html = '<div class="mythic-item-card' + (r.best ? ' mythic' : '') + (extraClass ? ' ' + extraClass : '') + '" data-idx="' + idx + '">';
  if (r.best) html += '<span class="owned-badge" style="background:var(--best);">TOP</span>';
  if (r.icon) html += '<img src="' + r.icon + '" alt="">';
  html += '<div class="name">' + r.name + (r.count > 1 ? (' x' + r.count) : '') + '</div>';
  html += '<div class="pct mono">' + pct(r.prob) + '%</div>';
  html += '</div>';
  return html;
}

function renderRoyalItemGrid(box) {
  const grid = document.getElementById('royalItemGrid');
  if (!grid) return;
  let html = '';
  box.rewards.forEach((r, i) => {
    const selected = target.kind === 'row' && target.idx === i;
    let cls = selected ? 'royal-selected' : '';
    if (royalFlashIds.has(r.id)) cls = (cls + ' flash-gold').trim();
    html += royalItemCard(r, i, cls);
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.mythic-item-card').forEach(card => {
    card.onclick = () => {
      target = { kind: 'row', idx: parseInt(card.dataset.idx, 10) };
      render();
    };

// ---------- 로얄 상자 시뮬레이터 ----------
// 신화 상자 시뮬레이터와 동일한 연출 패턴(청크 단위 지연 진행 + TOP 적중 시
// "이어하기" 모달로 자동진행 일시정지)을 그대로 재사용한다 - 다만 여기는
// 단일 단계(트리거 확률 없이 즉시 box.rewards 가중치 롤 1회 = 뽑기 1회)라서
// runMythicSimulation의 1단계 버전에 가깝다. 금액/기대값 계산 로직(render()
// 안의 EV 계산기)은 건드리지 않고, 그 위에 "실제로 뽑아보는" 체감용 레이어만
// 얹은 것 - 확률 계산 자체는 이 연출 지연과 무관하게 매 시행 독립적으로 굴린다.
let royalCumulative = {}; // box.id -> { trials, bestItemCounts, normalItemCounts, bestObtained, lastBestTrialIndex, spentSale, spentCash } - 초기화 버튼 전까지 계속 누적
let royalTrials = 10;
let royalAnimating = false;
let royalRecentEvents = [];
let royalFlashIds = new Set(); // 바로 다음 렌더 1회에만 반짝임 효과를 줄 아이템 id - 렌더 직후 비운다

function emptyRoyalCumulative() {
  return {
    trials: 0, bestItemCounts: {}, normalItemCounts: {}, bestObtained: 0, lastBestTrialIndex: 0,
    spentSale: 0, spentCash: 0, royalPoints: 0, bonusPulls: 0,
    tickets: {}, // rewardId -> 뽑아서 획득했지만 아직 교환 안 한 "OO 의상 선택권" 개수
    obtained: {}, // pieceId -> { name, count } - 교환해서 실제로 확인한 구성품 누적(렌더링 없이 텍스트/아이콘만)
  };
}
function getRoyalCumulative(box) {
  if (!royalCumulative[box.id]) royalCumulative[box.id] = emptyRoyalCumulative();
  return royalCumulative[box.id];
}
function royalLogHtml() {
  if (!royalRecentEvents.length) return '<div class="mythic-log-empty small">실행하면 최근 결과가 여기 실시간으로 표시됩니다.</div>';
  return royalRecentEvents.map(e => '<div class="mythic-log-entry royal">' + e.text + '</div>').join('');
}
function trimRoyalEvents() {
  const safetyMax = 5000;
  if (royalRecentEvents.length > safetyMax) royalRecentEvents.length = safetyMax;
}

function rollRoyalReward(box) {
  const roll = Math.random() * 10000;
  let acc = 0;
  for (const r of box.rewards) {
    acc += r.prob;
    if (roll < acc) return r;
  }
  return box.rewards[box.rewards.length - 1];
}

function runRoyalSimulation(box, trials) {
  if (royalAnimating) return;
  royalAnimating = true;
  const cum = getRoyalCumulative(box);
  const saleTier = cheapestTier(box, 'sale');
  const cashTier = cheapestTier(box, 'cash');
  const cheapSale = saleTier.sale / saleTier.n;
  const cheapCash = cashTier.cash / cashTier.n;

  // 로얄 상자는 10개들이 묶음으로 사면 보너스로 +1회가 따라온다(1개씩 10번
  // 따로 사는 건 해당 없음) - 이 시뮬레이터의 "N회" 버튼은 항상 제일 저렴한
  // 묶음(cheapestTier가 고른 단가, 보통 10개들이)으로 산다고 가정하므로 N이
  // 10의 배수인 만큼은 자동으로 묶음 구매로 취급해 보너스를 끼워 넣는다.
  // 보너스 뽑기는 아이템만 나오고 비용·포인트는 붙지 않는다(구매한 만큼만
  // 과금·적립 - 11개를 얻어도 포인트는 10점).
  const sequence = [];
  for (let i = 1; i <= trials; i++) {
    sequence.push(false);
    if (i % 10 === 0) sequence.push(true);
  }
  const totalRolls = sequence.length;
  const totalSteps = Math.min(50, totalRolls);
  const chunk = Math.max(1, Math.ceil(totalRolls / totalSteps));
  let done = 0;

  function processOne(idx) {
    cum.trials++;
    const isBonus = sequence[idx];
    if (isBonus) {
      cum.bonusPulls++;
    } else {
      cum.spentSale += cheapSale;
      cum.spentCash += cheapCash;
      cum.royalPoints++;
    }
    const chosen = rollRoyalReward(box);
    // "OO 의상 선택권"류를 뽑으면 곧바로 구성품이 정해지는 게 아니라 교환권
    // 보유 수만 늘려둔다 - 실제로 뭘 받았는지 보려면 사용자가 직접
    // "교환하기"로 하나를 골라야 한다(요청, 2026-08-20 - 획득만으로는 목록에
    // 안 뜨고 교환까지 해야 보유 아이템에 반영됨). 렌더링/좌표 데이터는
    // 전혀 다루지 않고 이름/아이콘 텍스트 목록만 오간다.
    if (box.exchangeEnabled && chosen.choices && chosen.choices.length) {
      cum.tickets[chosen.id] = (cum.tickets[chosen.id] || 0) + 1;
    }
    if (chosen.best) {
      cum.bestObtained++;
      cum.bestItemCounts[chosen.name] = (cum.bestItemCounts[chosen.name] || 0) + 1;
      const sinceLast = cum.trials - cum.lastBestTrialIndex;
      cum.lastBestTrialIndex = cum.trials;
      royalFlashIds.add(chosen.id);
      royalRecentEvents.unshift({ text: cum.trials.toLocaleString('ko-KR') + '번째 뽑기에서 TOP 획득! ' + chosen.name + (isBonus ? ' (보너스)' : '') });
      return { chosen, sinceLast, isBonus };
    }
    cum.normalItemCounts[chosen.name] = (cum.normalItemCounts[chosen.name] || 0) + 1;
    return null;
  }

  function finish() {
    royalAnimating = false;
    renderRoyalItemGrid(box);
    renderRoyalSim(box);
    if (box.exchangeEnabled) refreshExchangeBox(box);
  }

  function step() {
    let hit = null;
    let n = 0;
    while (n < chunk && done + n < totalRolls) {
      const result = processOne(done + n);
      n++;
      if (result) { hit = result; break; }
    }
    trimRoyalEvents();
    done += n;
    renderRoyalItemGrid(box);
    renderRoyalSim(box);
    if (box.exchangeEnabled) refreshExchangeBox(box);
    royalFlashIds.clear();

    if (hit) {
      showRoyalHitModal(box, hit, done, totalRolls, () => {
        if (done < totalRolls) setTimeout(step, 30); else finish();
      });
      return;
    }
    if (done < totalRolls) {
      setTimeout(step, 30);
    } else {
      finish();
    }
  }
  step();
}

function showRoyalHitModal(box, hit, done, totalRolls, onContinue) {
  const { chosen, sinceLast, isBonus } = hit;
  let html = '<h3>TOP 아이템 획득!' + (isBonus ? ' <span class="small stat-orange">(보너스 뽑기)</span>' : '') + '</h3>';
  html += '<div class="modal-icon-row">';
  if (chosen.icon) html += '<img src="' + chosen.icon + '" alt="">';
  html += '<div class="gold-shine" style="font-size:15px;">' + chosen.name + '</div>';
  html += '</div>';
  html += '<p class="modal-desc">' + sinceLast.toLocaleString('ko-KR') + '번째 뽑기 만에 획득했습니다!</p>';
  html += '<p class="small">진행 상황: ' + done.toLocaleString('ko-KR') + ' / ' + totalRolls.toLocaleString('ko-KR') + '회</p>';
  html += '<div class="modal-actions"><button id="royalContinueBtn" class="confirm">이어하기</button></div>';
  pendingModalContinue = onContinue;
  showModal(html, 'gold-glow');
  document.getElementById('royalContinueBtn').onclick = hideModal;
}

function renderRoyalSim(box) {
  const el = document.getElementById('royalSimBox');
  if (!el) return;
  const cum = getRoyalCumulative(box);

  let html = '<div class="n-presets" id="royalTrialButtons">';
  [1, 10, 50, 100, 1000, 10000].forEach(n => {
    const bonus = Math.floor(n / 10);
    const label = n.toLocaleString('ko-KR') + '회' + (bonus > 0 ? ' (+' + bonus.toLocaleString('ko-KR') + ')' : '');
    html += '<button data-n="' + n + '" class="' + (royalTrials === n ? 'active' : '') + '"' + (royalAnimating ? ' disabled' : '') + '>' + label + '</button>';
  });
  html += '<button id="royalRunBtn" class="run-btn"' + (royalAnimating ? ' disabled' : '') + '>' + (royalAnimating ? '뽑는 중...' : '뽑기 실행') + '</button>';
  html += '<button id="royalResetBtn" class="reset-btn"' + (royalAnimating ? ' disabled' : '') + '>초기화</button>';
  html += '</div>';
  html += '<p class="small" style="margin-top:6px;">버튼의 (+N)은 10개 묶음 구매 보너스입니다 - 10개들이 묶음마다 아이템 1개를 더 얻지만, 소비 금액·적립 포인트는 구매한 개수만큼만 계산됩니다.</p>';

  html += '<div class="calc-grid" style="margin-top:12px;">';
  html += '<div class="k">누적 뽑기 횟수</div><div class="v">' + cum.trials.toLocaleString('ko-KR') + '회' +
    (cum.bonusPulls ? (' <span class="small stat-orange">(보너스 ' + cum.bonusPulls.toLocaleString('ko-KR') + '회 포함)</span>') : '') + '</div>';
  html += '<div class="k">TOP 아이템 획득</div><div class="v stat-orange">' + cum.bestObtained.toLocaleString('ko-KR') + '회' +
    (cum.trials ? (' (' + (cum.bestObtained / cum.trials * 100).toFixed(2) + '%)') : '') + '</div>';
  html += '<div class="k">누적 소비 금액(할인가)</div><div class="v">' + fmtWon(cum.spentSale) + '</div>';
  html += '<div class="k">누적 소비 금액(정가)</div><div class="v">' + fmtWon(cum.spentCash) + '</div>';
  html += '<div class="k">누적 로얄 포인트</div><div class="v">' + (cum.royalPoints || 0).toLocaleString('ko-KR') + '점</div>';
  html += '</div>';

  html += '<div class="mythic-log" id="royalLog">' + royalLogHtml() + '</div>';

  const bestNames = Object.keys(cum.bestItemCounts);
  if (bestNames.length) {
    html += '<table style="margin-top:10px;"><thead><tr><th>TOP 아이템 획득(누적)</th><th>횟수</th></tr></thead><tbody>';
    bestNames.sort((a, b) => cum.bestItemCounts[b] - cum.bestItemCounts[a]).forEach(n => {
      html += '<tr><td class="gold-shine">' + n + '</td><td class="mono">' + cum.bestItemCounts[n] + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  const normalNames = Object.keys(cum.normalItemCounts);
  if (normalNames.length) {
    html += '<table style="margin-top:10px;"><thead><tr><th>일반 아이템 획득(누적)</th><th>횟수</th></tr></thead><tbody>';
    normalNames.sort((a, b) => cum.normalItemCounts[b] - cum.normalItemCounts[a]).forEach(n => {
      html += '<tr><td>' + n + '</td><td class="mono">' + cum.normalItemCounts[n] + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  html += '<p class="small">위 확률표대로 그때그때 무작위 시뮬레이션합니다 - 실제 게임 결과를 보장하지 않습니다. "초기화"를 누르기 전까지 여러 번 실행한 결과가 계속 누적됩니다.</p>';

  el.innerHTML = html;

  const trialBtns = document.getElementById('royalTrialButtons');
  if (trialBtns) {
    trialBtns.querySelectorAll('button[data-n]').forEach(btn => {
      btn.onclick = () => { royalTrials = parseInt(btn.dataset.n, 10); renderRoyalSim(box); };
    });
  }
  const runBtn = document.getElementById('royalRunBtn');
  if (runBtn) runBtn.onclick = () => runRoyalSimulation(box, royalTrials);
  const resetBtn = document.getElementById('royalResetBtn');
  if (resetBtn) {
    resetBtn.onclick = () => {
      royalCumulative[box.id] = emptyRoyalCumulative();
      royalRecentEvents = [];
      renderRoyalItemGrid(box);
      renderRoyalSim(box);
      if (box.exchangeEnabled) refreshExchangeBox(box);
    };
  }
}

// ---------- 신화 상자 시뮬레이터 ----------
const mythicZones = DATA.mythicZones || [];
const statusNames = DATA.statusNames || {};
const statusDecimals = DATA.statusDecimals || {};
let mythicZoneIdx = 0;
let mythicTrials = 100;
let mythicCumulative = {}; // zone.key -> { trials, boxAppeared, mythicObtained, mythicItemCounts, normalItemCounts } - 초기화 버튼 전까지 계속 누적

function emptyMythicCumulative() {
  // lastMythicTrialIndex: 직전 신화 아이템을 얻은 시점의 누적 클리어 횟수 -
  // "이번 부위는 직전 걸로부터 몇 시간 만에 나왔는지"를 매번 새로 재는 데 쓴다.
  return { trials: 0, boxAppeared: 0, mythicObtained: 0, mythicItemCounts: {}, normalItemCounts: {}, lastMythicTrialIndex: 0 };
}
let mythicOwnedBoxes = {}; // zone.key -> 미개봉 "신화 무기 상자" 보유 개수(아마란스 노바 전용, 3단계 존만 의미 있음)
let mythicOpenedTally = {}; // zone.key -> { itemId: count } - 실제로 개봉해서 확인된 무기별 누적
let mythicAnimating = false;
let mythicRecentEvents = []; // 최근 이벤트 피드(최대 8개) - { type: 'box'|'mythic', text }
let mythicFlashIds = new Set(); // 바로 다음 렌더 1회에만 반짝임 효과를 줄 아이템 id - 렌더 직후 비운다
let mythicClearMinutes = 5; // 사용자가 입력한 "인던 1회 클리어 시간(분)" - 신화템 획득 시점의 누적 클리어 횟수에 곱해 실제 소요 시간을 보여주는 데 쓴다

function formatMythicDuration(totalMinutes) {
  const mins = Math.round(totalMinutes);
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return (h > 0 ? h.toLocaleString('ko-KR') + '시간 ' : '') + m + '분';
}

function mythicMythicItems(zone) { return zone.itemset.filter(it => it.mythic); }

function getMythicCumulative(zone) {
  if (!mythicCumulative[zone.key]) {
    mythicCumulative[zone.key] = emptyMythicCumulative();
  }
  return mythicCumulative[zone.key];
}
function getMythicOwnedBoxes(zone) { return mythicOwnedBoxes[zone.key] || 0; }
function getMythicOpenedTally(zone) {
  if (!mythicOpenedTally[zone.key]) mythicOpenedTally[zone.key] = {};
  return mythicOpenedTally[zone.key];
}
function findMythicItemById(zone, id) {
  const inSet = zone.itemset.find(it => it.id === id);
  if (inSet) return inSet;
  if (zone.secondBox) return zone.secondBox.items.find(it => it.id === id);
  return null;
}

function mythicLogHtml() {
  if (!mythicRecentEvents.length) return '<div class="mythic-log-empty small">실행하면 최근 결과가 여기 실시간으로 표시됩니다.</div>';
  return mythicRecentEvents.map(e =>
    '<div class="mythic-log-entry ' + e.type + (e.type === 'mythic' ? ' mythic-shine' : '') + '">' + e.text + '</div>'
  ).join('');
}

// 로그는 잘라내지 않고 스크롤로 전부 훑어볼 수 있게 둔다("초기화"를 누르기
// 전까지 계속 쌓임) - 브라우저 메모리 보호용으로만 아주 넉넉한 안전 상한을
// 둔다(정상적인 사용에서는 절대 닿지 않는 값).
function trimMythicEvents() {
  const safetyMax = 5000;
  if (mythicRecentEvents.length > safetyMax) mythicRecentEvents.length = safetyMax;
}

function statLine(stats) {
  if (!stats || !stats.length) return '<p class="small">별도 능력치 없음</p>';
  return '<div class="modal-stats">' + stats.map(([type, val]) => {
    const name = statusNames[String(type)] || ('타입' + type);
    const dec = statusDecimals[String(type)] || 0;
    const shown = dec > 0 ? (val / Math.pow(10, dec)).toFixed(dec) : val.toLocaleString('ko-KR');
    return '<div><span>' + name + '</span><span class="mono">' + shown + '</span></div>';
  }).join('') + '</div>';
}

// "OO 의상 선택권"류 아이템은 실제로는 무작위가 아니라 구성품 중 하나를
// 직접 골라 교환하는 확정형 아이템이다 - 확률 없이 "이 중에서 고를 수
// 있다"는 체험만 보여준다(요청 - 시뮬레이터도 체험의 장이니까).
function choiceGridHtml(choices) {

  html += '<div class="mythic-item-grid">';
  choices.forEach(c => {
    html += '<div class="mythic-item-card">';
    if (c.icon) html += '<img src="' + c.icon + '" alt="">';
    html += '<div class="name">' + c.name + '</div>';
    html += '</div>';

}

function showItemDetail(it) {

// ---------- 교환 · 보유 아이템(렌더링 없음, 텍스트/아이콘 목록만) ----------
// 벨리알/러블리 메르헨이 나오는 두 상자 전용 - 뽑기로 "OO 의상 선택권"을
// 획득하면 교환권으로 쌓아두고, 사용자가 "교환하기"로 구성품 중 하나를
// 직접 고르면 보유 아이템 목록에 이름+아이콘으로만 쌓인다. 캐릭터에 입혀
// 보여주는 기능은 없다(요청, 2026-08-20 - 좌표/레이어 데이터를 공개
// 페이지에 노출하면 charsim 렌더링 방식이 드러날 수 있어 완전히 제외).
function exchangeTicket(box, reward, piece) {
  const cum = getRoyalCumulative(box);
  if ((cum.tickets[reward.id] || 0) <= 0) return;
  cum.tickets[reward.id]--;
  const o = cum.obtained[piece.id] || { name: piece.name, count: 0 };
  o.count++;
  cum.obtained[piece.id] = o;
  refreshExchangeBox(box);
}

function showExchangePicker(box, reward) {
  const cum = getRoyalCumulative(box);
  let html = '<h3>' + reward.name + ' 교환</h3>';
  html += '<p class="small">보유 ' + (cum.tickets[reward.id] || 0) + '개 - 하나를 고르면 교환권 1개가 소모되고 보유 아이템 목록에 추가됩니다.</p>';
  html += '<div class="mythic-item-grid" id="exchangeGrid">';
  reward.choices.forEach((c, i) => {
    html += '<div class="mythic-item-card" data-idx="' + i + '">';
    if (c.icon) html += '<img src="' + c.icon + '" alt="">';
    html += '<div class="name">' + c.name + '</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="modal-actions"><button id="modalCloseBtn">닫기</button></div>';
  showModal(html);
  document.getElementById('modalCloseBtn').onclick = hideModal;
  document.getElementById('exchangeGrid').querySelectorAll('.mythic-item-card').forEach(card => {
    card.onclick = () => {
      const piece = reward.choices[parseInt(card.dataset.idx, 10)];
      exchangeTicket(box, reward, piece);
      hideModal();
    };
  });
}

function refreshExchangeBox(box) {

  const ticketIds = Object.keys(cum.tickets).filter(id => cum.tickets[id] > 0);
  if (ticketIds.length) {
    html += '<h4 style="margin:0 0 6px;font-size:13px;color:var(--accent);">보유 교환권</h4>';

    ticketIds.forEach(id => {

  const obtainedIds = Object.keys(cum.obtained);

    html += '<table><thead><tr><th>아이템</th><th>개수</th></tr></thead><tbody>';

function openMythicBoxNow(zone) {
  mythicOwnedBoxes[zone.key] = getMythicOwnedBoxes(zone) - 1;
  const items = zone.secondBox.items;
  const won = items[Math.floor(Math.random() * items.length)];
  const tally = getMythicOpenedTally(zone);
  tally[won.id] = (tally[won.id] || 0) + 1;
  const cum = getMythicCumulative(zone);
  cum.mythicItemCounts[won.name] = (cum.mythicItemCounts[won.name] || 0) + 1;

// 실제로는 즉시 계산 가능한 결과를, 몇 단계로 나눠 약간의 지연을 두고
// 순차 반영한다 - 큰 N도 "실시간으로 굴러가는" 느낌을 주기 위해서다(순수
// 즉시계산은 숫자가 훅 바뀌어버려 뽑는 재미가 없다는 요청). 실제 확률
// 계산 자체(각 시행의 당첨 여부)는 이 지연과 무관하게 매 시행 독립적으로
// 굴린다 - 연출용 지연일 뿐 결과 분포에는 영향 없음. 3단계 존(신화 무기
// 상자가 있는 아마란스 노바)은 여기서 무기까지 자동으로 굴리지 않고 "상자
// 획득"까지만 처리한다 - 실제 개봉은 사용자가 상자 카드를 눌러 확인하는
// confirmOpenMythicBox/openMythicBoxNow 몫이다. 신화템이 나온 순간엔 로그
// 속에 묻혀 지나치기 쉬워서(요청 - 상자 등장! 사이에 끼여 보기 힘들다),
// 그 지점에서 자동진행을 멈추고 "이어하기" 모달로 확인시킨 뒤에만 재개한다.
function runMythicSimulation(zone, trials) {
  if (mythicAnimating) return;
  mythicAnimating = true;
  const cum = getMythicCumulative(zone);
  const p1 = zone.triggerPct / 100;
  const totalSteps = Math.min(50, trials);
  const chunk = Math.max(1, Math.ceil(trials / totalSteps));
  let done = 0;

  function processOne() {
    cum.trials++;
    if (Math.random() >= p1) return null;
    cum.boxAppeared++;
    mythicRecentEvents.unshift({ type: 'box', text: '신화 상자 등장!' });
    const roll = Math.random() * zone.itemsetTotal;
    let acc = 0, chosen = null;
    for (const it of zone.itemset) {
      acc += it.weight;
      if (roll < acc) { chosen = it; break; }
    }
    if (chosen && chosen.mythic) {
      cum.mythicObtained++;
      const isFirstMythic = cum.mythicObtained === 1;
      mythicFlashIds.add(chosen.id);
      const sinceLast = cum.trials - cum.lastMythicTrialIndex;
      const elapsed = formatMythicDuration(sinceLast * mythicClearMinutes);
      cum.lastMythicTrialIndex = cum.trials;
      if (zone.secondBox) {
        mythicOwnedBoxes[zone.key] = getMythicOwnedBoxes(zone) + 1;
        mythicRecentEvents.unshift({ type: 'mythic', text: elapsed + ' 만에 ' + chosen.name + ' 획득! (미개봉)' });
      } else {
        cum.mythicItemCounts[chosen.name] = (cum.mythicItemCounts[chosen.name] || 0) + 1;
        const tally = getMythicOpenedTally(zone);
        tally[chosen.id] = (tally[chosen.id] || 0) + 1;
        mythicRecentEvents.unshift({ type: 'mythic', text: elapsed + ' 만에 신화 아이템 획득! ' + chosen.name });
      }
      return { chosen, elapsed, sinceLast, isFirstMythic };
    } else if (chosen) {
      cum.normalItemCounts[chosen.name] = (cum.normalItemCounts[chosen.name] || 0) + 1;
    }
    return null;
  }

  function finish() {
    mythicAnimating = false;
    renderMythicItemsetGrid();
    renderMythicSim();
  }

  function step() {
    let hit = null;
    let n = 0;
    while (n < chunk && done + n < trials) {
      const result = processOne();
      n++;
      if (result) { hit = result; break; }
    }
    trimMythicEvents();
    done += n;
    renderMythicItemsetGrid();
    renderMythicSim();
    mythicFlashIds.clear();

    if (hit) {
      showMythicHitModal(zone, hit, done, trials, () => {
        if (done < trials) setTimeout(step, 30); else finish();
      });
      return;
    }
    if (done < trials) {
      setTimeout(step, 30);
    } else {
      finish();
    }
  }
  step();
}

function showMythicHitModal(zone, hit, done, trials, onContinue) {
  const { chosen, elapsed, sinceLast, isFirstMythic } = hit;
  let html = '<h3>신화 아이템 획득!</h3>';
  html += '<div class="modal-icon-row">';
  if (chosen.icon) html += '<img src="' + chosen.icon + '" alt="">';
  html += '<div class="mythic-shine" style="font-size:15px;">' + chosen.name + (zone.secondBox ? ' (미개봉)' : '') + '</div>';
  html += '</div>';
  html += '<p class="modal-desc">' + zone.name + ' 인던 ' + sinceLast.toLocaleString('ko-KR') + '회, ' + elapsed + ' 만에 획득했습니다!</p>';
  html += '<p class="small">진행 상황: ' + done.toLocaleString('ko-KR') + ' / ' + trials.toLocaleString('ko-KR') + '회</p>';
  if (sinceLast <= 100) {
    html += '<p class="easter-egg">🍀 당신은 운이 아주 좋으시네요! <a href="#" id="mythicEasterEggLink">로얄 까러가보시는건 어떨까요?</a></p>';
  } else if (isFirstMythic && sinceLast >= 30000) {
    html += '<p class="easter-egg">😅 이 정도면 템은 사 드셔야겠는데요??</p>';
  }
  html += '<div class="modal-actions"><button id="mythicContinueBtn" class="confirm">이어하기</button></div>';
  pendingModalContinue = onContinue;
  showModal(html, 'mythic-glow');
  document.getElementById('mythicContinueBtn').onclick = hideModal;
  const eggLink = document.getElementById('mythicEasterEggLink');
  if (eggLink) {
    eggLink.onclick = (e) => {
      e.preventDefault();
      // 로얄 상자 쪽으로 넘어가니 남은 시뮬레이션은 재개하지 않고 여기서 멈춘다
      // (hideModal의 자동 재개를 타지 않도록 직접 닫는다).
      pendingModalContinue = null;
      mythicAnimating = false;
      modalOverlay.classList.add('hidden');
      modalBox.innerHTML = '';
      switchMode('royal');
    };
  }
}

function renderMythicSim() {
  const zone = mythicZones[mythicZoneIdx];
  const box = document.getElementById('mythicSimBox');
  if (!zone || !box) return;
  const cum = getMythicCumulative(zone);

  let html = '<div class="n-presets" id="mythicTrialButtons">';
  [1, 10, 50, 100, 1000, 10000].forEach(n => {
    html += '<button data-n="' + n + '" class="' + (mythicTrials === n ? 'active' : '') + '"' + (mythicAnimating ? ' disabled' : '') + '>' + n.toLocaleString('ko-KR') + '회</button>';
  });
  html += '<button id="mythicRunBtn" class="run-btn"' + (mythicAnimating ? ' disabled' : '') + '>' + (mythicAnimating ? '인던 도는 중...' : '인던 돌기') + '</button>';
  html += '<button id="mythicResetBtn" class="reset-btn"' + (mythicAnimating ? ' disabled' : '') + '>초기화</button>';
  html += '</div>';

  html += '<div class="n-presets" style="margin-top:6px;"><label class="small" for="mythicClearMinInput">인던 1회 클리어 시간(분)</label>' +
    '<input type="number" id="mythicClearMinInput" min="0.1" step="0.5" value="' + mythicClearMinutes + '"></div>';

  html += '<div class="calc-grid" style="margin-top:12px;">';
  html += '<div class="k">누적 인던 클리어 횟수</div><div class="v">' + cum.trials.toLocaleString('ko-KR') + '회</div>';
  html += '<div class="k">신화 상자 등장</div><div class="v stat-orange">' + cum.boxAppeared.toLocaleString('ko-KR') + '회' +
    (cum.trials ? (' (' + (cum.boxAppeared / cum.trials * 100).toFixed(2) + '%)') : '') + '</div>';
  html += '<div class="k">신화 아이템 획득</div><div class="v stat-purple">' + cum.mythicObtained.toLocaleString('ko-KR') + '회' +
    (cum.trials ? (' (' + (cum.mythicObtained / cum.trials * 100).toFixed(4) + '%)') : '') + '</div>';
  if (zone.secondBox) {
    html += '<div class="k">미개봉 신화 무기 상자</div><div class="v stat-purple">' + getMythicOwnedBoxes(zone).toLocaleString('ko-KR') + '개</div>';
  }
  html += '</div>';

  html += '<div class="mythic-log" id="mythicLog">' + mythicLogHtml() + '</div>';

  const mythicNames = Object.keys(cum.mythicItemCounts);
  if (mythicNames.length) {
    html += '<table style="margin-top:10px;"><thead><tr><th>' + (zone.secondBox ? '개봉해서 확인한 아이템(누적)' : '신화 아이템 획득(누적)') + '</th><th>횟수</th></tr></thead><tbody>';
    mythicNames.sort((a, b) => cum.mythicItemCounts[b] - cum.mythicItemCounts[a]).forEach(n => {
      html += '<tr><td class="mythic-shine">' + n + '</td><td class="mono">' + cum.mythicItemCounts[n] + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  const normalNames = Object.keys(cum.normalItemCounts);
  if (normalNames.length) {
    html += '<table style="margin-top:10px;"><thead><tr><th>일반 아이템 획득(누적)</th><th>횟수</th></tr></thead><tbody>';
    normalNames.sort((a, b) => cum.normalItemCounts[b] - cum.normalItemCounts[a]).forEach(n => {
      html += '<tr><td>' + n + '</td><td class="mono">' + cum.normalItemCounts[n] + '</td></tr>';
    });
    html += '</tbody></table>';
  }

  html += '<p class="small">위 표의 실제 확률대로 그때그때 무작위 시뮬레이션합니다 - 실제 게임 결과를 보장하지 않습니다. "초기화"를 누르기 전까지 여러 번 실행한 결과가 계속 누적됩니다.' +
    (zone.secondBox ? ' 신화 무기 상자를 얻으면 위 드롭 구성 카드가 보라색으로 바뀝니다 - 클릭해서 직접 열어보세요.' : '') + '</p>';

  box.innerHTML = html;

  const trialBtns = document.getElementById('mythicTrialButtons');
  if (trialBtns) {
    trialBtns.querySelectorAll('button[data-n]').forEach(btn => {
      btn.onclick = () => { mythicTrials = parseInt(btn.dataset.n, 10); renderMythicSim(); };
    });
  }
  const runBtn = document.getElementById('mythicRunBtn');
  if (runBtn) runBtn.onclick = () => runMythicSimulation(zone, mythicTrials);
  const clearMinInput = document.getElementById('mythicClearMinInput');
  if (clearMinInput) {
    clearMinInput.onchange = () => {
      const v = parseFloat(clearMinInput.value);
      if (v > 0) mythicClearMinutes = v;
    };
  }
  const resetBtn = document.getElementById('mythicResetBtn');
  if (resetBtn) {
    resetBtn.onclick = () => {
      mythicCumulative[zone.key] = emptyMythicCumulative();
      mythicOwnedBoxes[zone.key] = 0;
      mythicOpenedTally[zone.key] = {};
      mythicRecentEvents = [];
      renderMythic();
    };
  }
}

function mythicItemCard(it, pctText, extraClass, badgeText) {
  let html = '<div class="mythic-item-card' + (it.mythic ? ' mythic' : '') + (extraClass ? ' ' + extraClass : '') + '" data-item-id="' + it.id + '">';
  if (badgeText) html += '<span class="owned-badge">' + badgeText + '</span>';
  if (it.icon) html += '<img src="' + it.icon + '" alt="">';
  html += '<div class="name">' + it.name + '</div>';
  html += '<div class="pct mono">' + pctText + '</div>';
  html += '</div>';
  return html;
}

function renderMythicItemsetGrid() {
  const zone = mythicZones[mythicZoneIdx];
  const grid = document.getElementById('mythicItemsetGrid');
  if (!zone || !grid) return;
  let html = '';
  zone.itemset.slice().sort((a, b) => b.weight - a.weight).forEach(it => {
    const p = zone.itemsetTotal ? (it.weight / zone.itemsetTotal * 100) : 0;
    const isBoxCard = zone.secondBox && it.id === zone.secondBox.id;
    const owned = isBoxCard ? getMythicOwnedBoxes(zone) : 0;
    const obtainedCount = getMythicOpenedTally(zone)[it.id] || 0;
    let cls = '';
    let badge = null;
    if (isBoxCard && owned > 0) {
      cls = 'owned-box';
      badge = '보유 ' + owned;
    } else if (it.mythic && obtainedCount > 0) {
      cls = 'obtained';
      badge = '획득 ' + obtainedCount;
    }
    if (mythicFlashIds.has(it.id)) cls = (cls + ' flash').trim();
    html += mythicItemCard(it, (p < 0.01 ? p.toFixed(4) : p.toFixed(2)) + '%', cls, badge);
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.mythic-item-card').forEach(card => {
    card.onclick = () => {
      const id = parseInt(card.dataset.itemId, 10);
      if (zone.secondBox && id === zone.secondBox.id && getMythicOwnedBoxes(zone) > 0) {
        confirmOpenMythicBox(zone);
      } else {
        const it = findMythicItemById(zone, id);
        if (it) showItemDetail(it);
      }
    };
  });
}

function renderMythicSecondBoxGrid() {
  const zone = mythicZones[mythicZoneIdx];
  const grid = document.getElementById('mythicSecondBoxGrid');
  if (!zone || !grid || !zone.secondBox) return;
  const tally = getMythicOpenedTally(zone);
  const evenPct = zone.secondBox.items.length ? (100 / zone.secondBox.items.length) : 0;
  let html = '';
  zone.secondBox.items.forEach(it => {
    const cnt = tally[it.id] || 0;
    let cls = cnt > 0 ? 'obtained' : '';
    if (mythicFlashIds.has(it.id)) cls = (cls + ' flash').trim();
    html += mythicItemCard(it, '~' + evenPct.toFixed(2) + '%', cls, cnt > 0 ? ('획득 ' + cnt) : null);
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.mythic-item-card').forEach(card => {
    card.onclick = () => {
      const id = parseInt(card.dataset.itemId, 10);
      const it = findMythicItemById(zone, id);
      if (it) showItemDetail(it);
    };
  });
}

function renderMythic() {
  const zone = mythicZones[mythicZoneIdx];
  if (!zone) { main.innerHTML = '<p class="small">신화 상자 데이터가 없습니다.</p>'; return; }

  let out = '<div class="mythic-tabs">';
  mythicZones.forEach((z, i) => {
    out += '<button class="mythic-tab' + (i === mythicZoneIdx ? ' active' : '') + '" data-idx="' + i + '">' + z.name + '</button>';
  });
  out += '</div>';

  const mythicItems = mythicMythicItems(zone);
  const mythicWeight = mythicItems.reduce((s, it) => s + it.weight, 0);
  const stage2Pct = zone.itemsetTotal ? (mythicWeight / zone.itemsetTotal * 100) : 0;
  const stage1Pct = zone.triggerPct;
  const combined = (stage1Pct / 100) * (stage2Pct / 100);

  out += '<h2>' + zone.name + ' <span class="small">(최종보스: ' + zone.boss + ')</span></h2>';
  out += '<table><thead><tr><th>단계</th><th>확률</th></tr></thead><tbody>';
  out += '<tr><td>1. 인던 클리어 → 신화 상자 실제 등장</td><td class="mono">' + stage1Pct + '%</td></tr>';
  if (zone.secondBox) {
    out += '<tr><td>2. 신화 상자를 깨서 → 신화 무기 상자 획득</td><td class="mono">' + stage2Pct.toFixed(2) + '%</td></tr>';
    out += '<tr><td>3. 신화 무기 상자 개봉 → 무기 아무거나 하나</td><td class="mono">100%</td></tr>';
  } else {
    out += '<tr><td>2. 신화 상자를 깨서 → 신화 장비 하나 획득</td><td class="mono">' + stage2Pct.toFixed(2) + '%</td></tr>';
  }
  out += '</tbody></table>';
  out += '<p class="small">인던 1회 클리어당 "아무 신화템이나 하나" 얻을 총 확률: <strong class="mono">' + (combined * 100).toFixed(4) + '%</strong>' +
    (combined > 0 ? ' (약 1/' + Math.round(1 / combined).toLocaleString('ko-KR') + ')' : '') + '</p>';

  out += '<h2>신화 상자 드롭 구성 <span class="small">(전체 ' + zone.itemset.length + '종 · 상대 가중치 합계 ' + zone.itemsetTotal + ' · 카드를 클릭하면 설명이 나옵니다)</span></h2>';
  out += '<div class="mythic-item-grid" id="mythicItemsetGrid"></div>';

  if (zone.secondBox) {
    out += '<h2>' + zone.secondBox.name + ' 개봉 시 후보 <span class="small">(' + zone.secondBox.items.length + '종 - 개별 배분 확률은 공개 데이터 없음, 균등 추정)</span></h2>';
    out += '<div class="mythic-item-grid" id="mythicSecondBoxGrid"></div>';
  }

  out += '<h2>시뮬레이터</h2>';
  out += '<div class="calc-box" id="mythicSimBox"></div>';

  main.innerHTML = out;

  main.querySelectorAll('.mythic-tab').forEach(btn => {
    btn.onclick = () => {
      mythicZoneIdx = parseInt(btn.dataset.idx, 10);
      mythicRecentEvents = [];
      renderMythic();
    };
  });

  renderMythicItemsetGrid();
  renderMythicSecondBoxGrid();
  renderMythicSim();
}

let mode = 'royal';
const modeRoyalBtn = document.getElementById('modeRoyalBtn');
const modeMythicBtn = document.getElementById('modeMythicBtn');

function switchMode(m) {
  mode = m;
  modeRoyalBtn.classList.toggle('active', m === 'royal');
  modeMythicBtn.classList.toggle('active', m === 'mythic');
  boxSelect.style.display = m === 'royal' ? '' : 'none';
  if (m === 'royal') render(); else renderMythic();
}
modeRoyalBtn.addEventListener('click', () => switchMode('royal'));
modeMythicBtn.addEventListener('click', () => switchMode('mythic'));

boxSelect.addEventListener('change', () => { target = { kind: 'row', idx: 0 }; royalRecentEvents = []; render(); });
switchMode('royal');

</script>
</body>
</html>
