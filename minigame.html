<style>
:root{
  color-scheme:light dark;
  --btn-up:#23836a; --btn-up-hi:#2a9377; --btn-down:#b8456a; --btn-down-hi:#c85278; --btn-text:#fff;
  --bg:#faf7f4; --surface:#ffffff; --surface-2:#f6f1ee; --border:#e9e0dc;
  --text:#211d24; --text-muted:#6b6672;
  --accent:#c85678; --accent-strong:#a13a5b; --accent-2:#e0839e; --accent-soft:#f7dee6;
  --good:#279672; --good-strong:#1c7059; --good-2:#4fbb95; --good-soft:#dcf1e9;
  --nv-bg:#f2ecee; --nv-tab:#f7f1f3; --nv-hover:#efe6ea; --nv-ink:#221f26; --nv-ink2:#65616c; --nv-line:#dcd0d4; --nv-act-bg:#f4dde3; --nv-act:#b8506f; --nv-home:#c05f4f; --nv-home-ink:#fff;
  --shadow-sm:0 1px 2px rgba(40,20,30,.06);
  --shadow:0 1px 1px rgba(40,20,30,.04), 0 12px 28px -16px rgba(40,20,30,.28);
  --shadow-btn:0 1px 0 rgba(255,255,255,.35) inset, 0 -2px 5px rgba(0,0,0,.14) inset, 0 10px 18px -8px rgba(40,20,30,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141b; --surface:#1b1f29; --surface-2:#242a36; --border:#333a49;
  --text:#eef0f4; --text-muted:#9298a6;
  --accent:#e6899f; --accent-strong:#f2a7ba; --accent-2:#c85f7d; --accent-soft:#372a33;
  --good:#57caa0; --good-strong:#7ee0b8; --good-2:#2f9c78; --good-soft:#1c2b27;
  --nv-bg:#242a35; --nv-tab:#262d38; --nv-hover:#2c333f; --nv-ink:#eef0f4; --nv-ink2:#c6cad4; --nv-line:#3b4353; --nv-act-bg:#332631; --nv-act:#e08aa2; --nv-home:#dd8a78; --nv-home-ink:#1a1015;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 16px 32px -18px rgba(0,0,0,.7);
  --shadow-btn:0 1px 0 rgba(255,255,255,.08) inset, 0 -2px 5px rgba(0,0,0,.3) inset, 0 10px 20px -8px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#12141b; --surface:#1b1f29; --surface-2:#242a36; --border:#333a49;
  --text:#eef0f4; --text-muted:#9298a6;
  --accent:#e6899f; --accent-strong:#f2a7ba; --accent-2:#c85f7d; --accent-soft:#372a33;
  --good:#57caa0; --good-strong:#7ee0b8; --good-2:#2f9c78; --good-soft:#1c2b27;
  --nv-bg:#242a35; --nv-tab:#262d38; --nv-hover:#2c333f; --nv-ink:#eef0f4; --nv-ink2:#c6cad4; --nv-line:#3b4353; --nv-act-bg:#332631; --nv-act:#e08aa2; --nv-home:#dd8a78; --nv-home-ink:#1a1015;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 16px 32px -18px rgba(0,0,0,.7);
  --shadow-btn:0 1px 0 rgba(255,255,255,.08) inset, 0 -2px 5px rgba(0,0,0,.3) inset, 0 10px 20px -8px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:radial-gradient(760px 420px at 50% -8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%), var(--bg);
  color:var(--text);
  font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Hiragino Sans","Yu Gothic","Microsoft YaHei","PingFang SC",sans-serif;
  line-height:1.4;-webkit-font-smoothing:antialiased;touch-action:manipulation;
  display:flex;flex-direction:column;
}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{flex:1;min-height:0;display:flex;justify-content:center;padding:10px 14px max(10px,env(safe-area-inset-bottom))}
.app{width:100%;max-width:1000px;height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}

/* 사이트 공통 상단 탭 */
.site-tabs{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;background:var(--nv-bg);border-bottom:1px solid var(--nv-line)}
.site-tabs a{padding:8px 16px;line-height:1.5;border-radius:8px;background:var(--nv-tab);color:var(--nv-ink2);font-size:14px;text-decoration:none;transition:background .13s,color .13s}
.site-tabs a:hover{background:var(--nv-hover);color:var(--nv-ink)}
.site-tabs a.active{background:var(--nv-act-bg);color:var(--nv-act);font-weight:700;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nv-act) 45%,transparent)}
.site-tabs a.home{background:var(--nv-home);color:var(--nv-home-ink);font-weight:700}
.site-tabs a.home:hover{filter:brightness(1.08)}
@media (max-width:680px){.site-tabs{gap:6px;padding:max(8px,env(safe-area-inset-top)) 12px 8px}.site-tabs a{padding:6px 12px;font-size:13px}}

/* 머리글 */
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;flex:none}
h1{font-size:clamp(16px,4.6vw,21px);font-weight:900;letter-spacing:-.01em;white-space:nowrap}
h1 span{background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;align-items:center;gap:6px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px 5px 4px 10px;font-size:10.5px;color:var(--text-muted);font-weight:700;box-shadow:var(--shadow-sm);display:flex;align-items:center}
.sc b{font-size:15px;margin-left:5px;font-weight:900;font-variant-numeric:tabular-nums;min-width:1.5em;text-align:right;padding:1px 6px;border-radius:8px}
.sc.combo b{color:var(--accent-strong);background:var(--accent-soft)}
.sc.best b{color:var(--good-strong);background:var(--good-soft)}
.lk-lang{position:static!important;box-shadow:none!important;padding:2px}
.lk-lang button{padding:5px 7px!important}
h1 span.plain{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--text)}
.theme-toggle{width:32px;height:32px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:grid;place-items:center;font-size:14px;box-shadow:var(--shadow-sm)}

.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);flex:none}
.tabs button{flex:1;font-weight:800;font-size:13.5px;padding:8px 6px;border:none;border-radius:10px;background:transparent;color:var(--text-muted);transition:background .15s,color .15s}

/* 무대: 모바일은 위/아래, PC는 좌/우 */
.stage{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);gap:6px}
.m-desktop{display:none}
.mid{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mid .q{flex:1;display:flex;justify-content:center;min-width:0}
.mid span{padding:3px 12px;font-size:11px;font-weight:800;color:var(--text-muted);background:var(--bg);border:1px solid var(--border);border-radius:999px;white-space:nowrap}
.card{min-height:0;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:20px;
  padding:10px 14px;box-shadow:var(--shadow);position:relative;display:flex;align-items:center;gap:14px;
  transition:border-color .25s, box-shadow .25s}
.card.win{border-color:color-mix(in srgb,var(--good) 55%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent),var(--shadow)}
.card.lose{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.badge{position:absolute;top:-10px;right:16px;font-size:10.5px;font-weight:900;padding:3px 12px;border-radius:999px;color:#fff;opacity:0;transform:translateY(3px) scale(.9);transition:.25s cubic-bezier(.2,1.4,.4,1)}
.card.win .badge,.card.lose .badge{opacity:1;transform:none}
.card.win .badge{background:linear-gradient(120deg,var(--good-2),var(--good-strong))}
.card.lose .badge{background:linear-gradient(120deg,var(--accent),var(--accent-strong))}
.art{flex:none;height:100%;aspect-ratio:1;max-height:min(100%,124px);border-radius:18px;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 38%, color-mix(in srgb,var(--accent) 14%,var(--surface-2)),var(--surface-2) 68%);border:1px solid var(--border)}
.art{position:relative}
.art img{position:absolute;left:6%;top:6%;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(20,10,20,.2))}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.mname{font-size:clamp(15px,4.4vw,19px);font-weight:900;line-height:1.25;text-wrap:balance}
.where{align-self:flex-start;font-size:11px;font-weight:700;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:1px 9px;max-width:100%;white-space:normal;line-height:1.3}
.hprow{display:flex;align-items:baseline;gap:8px;margin-top:2px;min-height:1.1em}
.hplabel{font-size:10px;letter-spacing:.16em;color:var(--text-muted);font-weight:800}
.hp{font-size:clamp(22px,7vw,30px);font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.hp.q{color:var(--text-muted);opacity:.55}
.where b{color:var(--accent-strong);font-weight:900}
.hpraw{font-size:10.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;min-height:1em}

/* 하단 조작: 정답 버튼 <-> 다음 버튼이 같은 자리 */
.actions{flex:none;height:52px;display:grid}
.actions>*{grid-area:1/1}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:759px) and (max-height:640px){.hpraw{display:none}.hprow{margin-top:0}}
@media (max-width:759px) and (max-height:520px){.where{display:none}}
@media (min-width:760px) and (max-height:620px){.hpraw{display:none}.where{display:none}}
.guess button,.guess button:hover,.next:hover{transform:translateY(-1px)}
.guess button:active,.next:active{transform:translateY(1px) scale(.99)}
.guess button:disabled{filter:grayscale(.55) opacity(.5);cursor:default;transform:none;box-shadow:none}

@media (min-width:760px){
  .stage,.guess{--cols:minmax(0,1fr) 150px minmax(0,1fr)}
  .stage{grid-template-rows:minmax(0,1fr);grid-template-columns:var(--cols);gap:12px}
  .guess{grid-template-columns:var(--cols);gap:12px}
  .guess button[data-d=down]{grid-column:3}
    .m-mobile{display:none}.m-desktop{display:inline}
  .mid span{white-space:normal;text-align:center;line-height:1.35}
  .card{flex-direction:column;justify-content:center;text-align:center;padding:16px 18px;gap:12px}
  .art{flex:1 1 0;min-height:40px;height:auto;width:auto;max-height:240px;max-width:100%;aspect-ratio:1;align-self:center}
  .info{flex:none;align-items:center}
  .where{align-self:center}
  .hprow{justify-content:center}
  .mid{flex-direction:column;justify-content:center;gap:10px}
  .mid .q{order:-1;flex:none}
  .mname{font-size:21px}
  .hp{font-size:34px}
}


@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise .3s cubic-bezier(.22,.9,.36,1) both}


/* 버튼: 탭/칩과 같은 결의 톤온톤 스타일(연한 면 + 같은 색 테두리/글자). 올려두면 진한 색으로 채워진다. 다음 버튼만 로즈 단색 */
.guess button[data-d=up]{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 55%,var(--border));color:var(--good-strong);box-shadow:var(--shadow-sm)}
.guess button[data-d=down]{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 55%,var(--border));color:var(--accent-strong);box-shadow:var(--shadow-sm)}
.guess button[data-d=up]:not(:disabled):hover{background:var(--btn-up);border-color:var(--btn-up);color:#fff}

<style>

<script>

<script>
const DATA = JSON.parse(document.getElementById("mobs").textContent);
const $ = s => document.getElementById(s);
const RM = matchMedia("(prefers-reduced-motion:reduce)").matches;
const rnd = n => Math.floor(Math.random()*n);
const t = k => LKI18N.t(k);
const tf = (k, v) => t(k).replace(/\{(\w+)\}/g, (_, n) => v[n]);
const TITLE = () => t("몬스터 HP 미니게임");
const MODE_NAME = m => t(m === "boss" ? "보스 몬스터" : "일반 몬스터");
let mode = "boss", MOBS = DATA.boss;

(function(){
  const btn=$("themeToggle");
  const cur=()=>document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const sync=()=>{btn.textContent="◐";};
  sync();
  btn.onclick=()=>{const n=cur()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);
    try{localStorage.setItem("theme",n);}catch(e){} sync();};
})();

const UNITS={ko:[["조",1e12],["억",1e8],["만",1e4]], ja:[["兆",1e12],["億",1e8],["万",1e4]], zh:[["万亿",1e12],["亿",1e8],["万",1e4]],
  en:[["T",1e12],["B",1e9],["M",1e6],["K",1e3]]};
function fmt(n){
  const us=UNITS[LKI18N.lang()]||UNITS.ko;
  for(const [u,v] of us){ if(n>=v) return (n/v).toLocaleString("en",{maximumFractionDigits: v>=1e8?2:(n<v*10?1:0)})+u; }
  return n.toLocaleString("en");
}
function countUp(el,to){
  if(RM){ el.textContent=fmt(to); return; }
  const t0=performance.now(),dur=620;
  (function fr(t){const k=Math.min((t-t0)/dur,1),e=1-Math.pow(1-k,3);
    el.textContent=fmt(Math.round(to*e)); if(k<1) requestAnimationFrame(fr);})(t0);
}
const IMG_DIR = "minigame_img";
const imgUrl = m => IMG_DIR+"/"+m.i+".webp";

/* ───── 게임 ───── */
let T,B,combo=0,locked=false,best=0,lastBadge="";
const bestKey = () => "hpq_best_"+mode;
function loadBest(){ best=0; try{ best=+localStorage.getItem(bestKey())||0; }catch(e){} $("best").textContent=best; }
const pick = ()=>MOBS[rnd(MOBS.length)];
const fresh = a =>{ let m; do{ m=pick(); }while(a && (m.n===a.n||m.hp===a.hp)); return m; };

function fill(S,m){
  $("img"+S).onerror=()=>imgFailed(S,m);
  $("img"+S).src=imgUrl(m); $("img"+S).alt=m.n;
  $("name"+S).textContent=m.n;
  $("where"+S).innerHTML=esc(m.g||"")+(m.l?` <b>${esc(m.l)}</b>`:""); $("where"+S).hidden=!m.g;
  if(S==="T"){ countUp($("hpT"),m.hp); $("hprawT").textContent=m.hp.toLocaleString("en")+" HP"; }
  else{ $("hpB").textContent="?"; $("hpB").classList.add("q"); $("hprawB").textContent=""; }
}
// 그림을 불러오지 못한 몬스터는 문제에서 빼고 바로 다른 몬스터로 바꾼다(엑박이 화면에 남지 않게)
function imgFailed(S,m){
  for(const k of ["boss","mob"]){ const i=DATA[k].indexOf(m); if(i>=0) DATA[k].splice(i,1); }
  if(MOBS.length<3) return;
  if(S==="B" && !locked){ B=fresh(T); fill("B",B); }
  else if(S==="T"){ T=pick(); if(B&&!locked){ B=fresh(T); fill("B",B); } fill("T",T); }
}
function newRound(carry){
  locked=false;
  $("cardT").classList.remove("win","lose"); $("cardB").classList.remove("win","lose");
  $("badgeB").textContent=""; lastBadge="";
  $("guess").hidden=false; $("next").hidden=true;
  [...$("guess").children].forEach(b=>b.disabled=false);
  if(!carry || !T) T=pick();
  B=fresh(T);
  fill("T",T); fill("B",B);
  const c=$("cardB"); c.classList.remove("rise"); void c.offsetWidth; c.classList.add("rise");
}
function guess(dir){
  if(locked) return; locked=true;
  [...$("guess").children].forEach(b=>b.disabled=true);
  $("hpB").classList.remove("q"); countUp($("hpB"),B.hp);
  $("hprawB").textContent=B.hp.toLocaleString("en")+" HP";
  const higher=B.hp>=T.hp;
  const ok=(dir==="up"&&higher)||(dir==="down"&&!higher)||B.hp===T.hp;
  setTimeout(()=>{
    if(ok){
      combo++; $("combo").textContent=combo;
      $("combo").animate([{transform:"scale(1.3)"},{transform:"scale(1)"}],{duration:220});
      $("cardB").classList.add("win"); $("badgeB").textContent=t("정답"); lastBadge="정답";
      if(combo>best){ best=combo; $("best").textContent=best; try{localStorage.setItem(bestKey(),best);}catch(e){} }
      T=B; $("guess").hidden=true; $("next").hidden=false; $("next").textContent="다음 →"; $("next").focus({preventScroll:true});
    }else{
      $("cardB").classList.add("lose"); $("badgeB").textContent=t("오답"); lastBadge="오답";
      const final=combo, mon=T;   // 카드의 주인공: 마지막으로 이긴(기준이 된) 몬스터
      combo=0; $("combo").textContent=0; T=null;
      setTimeout(()=>showResult({mode,combo:final,id:mon.i,best}), RM?60:900);
    }
  }, RM?40:520);
}
$("guess").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&!b.disabled)guess(b.dataset.d);});
$("next").addEventListener("click",()=>newRound(true));
addEventListener("keydown",e=>{
  if(!$("ov").hidden){ if(e.key==="Escape") closeResult(); return; }
  if(e.key==="ArrowUp"&&!$("guess").hidden)$("guess").children[0].click();
  else if(e.key==="ArrowDown"&&!$("guess").hidden)$("guess").children[1].click();

function showResult(r,fromLink){

/* ───── 공유: 링크 복사 + 카드 이미지 저장 ───── */
function shareUrl(r){ return location.origin+location.pathname+location.search+"#r="+r.mode+"."+r.combo+"."+r.id; }
function parseHash(){
  const m=/^#r=(boss|mob)\.(\d{1,4})\.(\d+)$/.exec(location.hash); if(!m) return null;
  const r={mode:m[1],combo:+m[2],id:+m[3]}; return findMon(r.mode,r.id)?r:null;
}
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=t(msg); el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }
function loadImg(src){ return new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src;}); }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function rng(seed){ let s=seed>>>0; return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296; }

/* 보이는 카드 그대로 저장: 화면의 카드(DOM)를 SVG foreignObject 로 다시 그려 이미지로 만든다.
   10콤보 미만/금빛은 PNG, 오로라/홀로그램은 움직임까지 담은 GIF. 글꼴과 몬스터 그림은 SVG 안에 직접 넣는다. */
const WEBP_URL="https://cdn.jsdelivr.net/npm/wasm-webp@0.1.0/+esm";
const SNAP={half:44,width:560,q:80,delay:80};
const GIFENC_URL="https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js";
function blobToData(b){ return new Promise((res,rej)=>{ const f=new FileReader(); f.onload=()=>res(f.result); f.onerror=rej; f.readAsDataURL(b); }); }
async function embeddedFonts(text){
  try{
    const link=document.querySelector('link[href*="fonts.googleapis.com/css2"]'); if(!link) return "";
    const cps=[...new Set([...text].map(ch=>ch.codePointAt(0)))];
    const css=await (await fetch(link.href)).text();
    const blocks=css.match(/@font-face\s*\{[^}]*\}/g)||[]; let out="";
    for(const b of blocks){
      const w=/font-weight:\s*(\d+)/.exec(b); if(!w||![400,500,700,900].includes(+w[1])) continue;
      const ur=/unicode-range:\s*([^;]+)/.exec(b); let ok=!ur;
      if(ur) for(const part of ur[1].split(",")){
        const m=/U\+([0-9A-Fa-f]+)(?:-([0-9A-Fa-f]+))?/.exec(part.trim()); if(!m) continue;
        const a=parseInt(m[1],16), z=m[2]?parseInt(m[2],16):a; if(cps.some(cp=>cp>=a&&cp<=z)){ ok=true; break; } }
      if(!ok) continue;
      const u=/url\(([^)]+)\)/.exec(b); if(!u) continue;
      const data=await blobToData(await (await fetch(u[1].replace(/["']/g,""))).blob());
      out+=`@font-face{font-family:"Noto Sans KR";font-weight:${w[1]};src:url(${data});}`;
    }
    return out;
  }catch(e){ return ""; }
}
function snapTemplate(el){
  const clone=el.cloneNode(true), src=[el,...el.querySelectorAll("*")], dst=[clone,...clone.querySelectorAll("*")];
  src.forEach((s,i)=>{
    const d=dst[i], cs=getComputedStyle(s); let txt="";
    for(let k=0;k<cs.length;k++){ const pn=cs[k]; txt+=pn+":"+cs.getPropertyValue(pn)+";"; }
    d.setAttribute("style",txt); d.removeAttribute("id"); d.removeAttribute("class");
    if(cs.animationName&&cs.animationName!=="none"){
      d.setAttribute("data-anim",String(cs.animationName.split(",").length));
      d.setAttribute("data-ad",cs.animationDelay.split(",").map(x=>parseFloat(x)||0).join(","));
    }
  });
  clone.style.margin="0"; clone.style.position="relative"; clone.style.left="0"; clone.style.top="0"; clone.style.transform="none";
  return clone;
}
function snapKeyframes(){
  let out="";
  for(const sh of document.styleSheets){ try{ for(const r of sh.cssRules) if(r.type===7) out+=r.cssText+" "; }catch(e){} }
  return out.replace(/&/g,"&amp;").replace(/</g,"&lt;");
}
function snapFrameSvg(tpl,w,h,pad,tm,css){
  const c=tpl.cloneNode(true);
  [c,...c.querySelectorAll("*")].forEach(n=>{
    const a=n.getAttribute&&n.getAttribute("data-anim"); if(!a) return;
    const ad=(n.getAttribute("data-ad")||"0").split(",").map(parseFloat), cnt=parseInt(a,10), d=[], ps=[];
    for(let i=0;i<cnt;i++){ d.push((( ad[i%ad.length]||0)-tm).toFixed(3)+"s"); ps.push("paused"); }
    n.style.animationDelay=d.join(","); n.style.animationPlayState=ps.join(",");
    n.removeAttribute("data-anim"); n.removeAttribute("data-ad");
  });
  const inner=new XMLSerializer().serializeToString(c), W=w+pad*2, H=h+pad*2;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject x="0" y="0" width="'+W+'" height="'+H+'">'
    +'<div xmlns="http://www.w3.org/1999/xhtml" style="padding:'+pad+'px;width:'+W+'px;height:'+H+'px;box-sizing:border-box;background:transparent"><style>'+css+snapKeyframes()+'</style>'+inner+'</div></foreignObject></svg>';
}
function loadSvg(svg){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg); }); }
async function snapCard(r,animated,fmt){
  const mon=findMon(r.mode,r.id), wrap=document.querySelector(".rtilt");
  const rect=wrap.getBoundingClientRect(), w=rect.width, h=rect.height, pad=44;
  const tpl=snapTemplate(wrap);
  const im=tpl.querySelector("img"); if(im) im.setAttribute("src",await blobToData(await (await fetch(imgUrl(mon))).blob()));
  const css=await embeddedFonts(wrap.textContent+"0123456789");
  const SC=animated?Math.min(2,Math.max(1,SNAP.width/(w+pad*2))):2, W=Math.round((w+pad*2)*SC), H=Math.round((h+pad*2)*SC);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const c=cv.getContext("2d",{willReadFrequently:true});
  async function frame(tm){
    const img=await loadSvg(snapFrameSvg(tpl,w,h,pad,tm,css));
    c.setTransform(1,0,0,1,0,0);
    const g=c.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,Math.max(W,H)*.75); g.addColorStop(0,"#1a1d29"); g.addColorStop(1,"#0a0b10");
    c.fillStyle=g; c.fillRect(0,0,W,H); c.drawImage(img,0,0,W,H);
  }
  if(!animated){
    await frame(0);
    return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("blob")),"image/png"));
  }
  const HALF=SNAP.half, DELAY=SNAP.delay, frames=[];
  for(let i=0;i<HALF;i++){ await frame(i/(HALF-1)*3.5); frames.push(c.getImageData(0,0,W,H).data); await new Promise(r=>setTimeout(r,0)); }
  if(fmt==="webp"){
    const wp=await import(WEBP_URL), order=[];
    for(let k=0;k<HALF;k++) order.push(k); for(let k=HALF-2;k>0;k--) order.push(k);
    const out=await wp.encodeAnimation(W,H,true,order.map(k=>({data:new Uint8Array(frames[k].buffer,frames[k].byteOffset,frames[k].byteLength),duration:DELAY,config:{lossless:0,quality:SNAP.q}})));
    if(!out) throw new Error("webp");
    return new Blob([out],{type:"image/webp"});
  }
  const mod=await import(GIFENC_URL);
  const step=5, take=frames.filter((_,i)=>i%3===0), sample=new Uint8ClampedArray(Math.ceil(W*H/step)*4*take.length); let n=0;
  take.forEach(d=>{ for(let p=0;p<W*H;p+=step){ const o=n*4; sample[o]=d[p*4]; sample[o+1]=d[p*4+1]; sample[o+2]=d[p*4+2]; sample[o+3]=255; n++; } });
  const pal=mod.quantize(sample.subarray(0,n*4),256), order=[];
  for(let k=0;k<HALF;k++) order.push(k); for(let k=HALF-2;k>0;k--) order.push(k);
  const gif=mod.GIFEncoder(), bayer=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  for(let j=0;j<order.length;j++){
    const d=new Uint8ClampedArray(frames[order[j]]);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const o=(y*W+x)*4, b=(bayer[(y&3)*4+(x&3)]/16-.47)*6; d[o]+=b; d[o+1]+=b; d[o+2]+=b; }
    gif.writeFrame(mod.applyPalette(d,pal),W,H,j===0?{palette:pal,delay:DELAY}:{delay:DELAY});
    await new Promise(r=>setTimeout(r,0));
  }
  gif.finish();
  return new Blob([gif.bytes()],{type:"image/gif"});
}
async function shareResult(r,still){
  if(!r) return;
  const url=shareUrl(r);
  let copied=false;
  try{ await navigator.clipboard.writeText(url); copied=true; }catch(e){
    const ta=document.createElement("textarea"); ta.value=url; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{ copied=document.execCommand("copy"); }catch(_){} ta.remove(); }
  let saved=false, blob=null;
  const anim=!still&&tierOf(r.combo)>=2;
  for(const f of anim?["webp","gif","png"]:["png"]){ try{ blob=await snapCard(r,f!=="png",f); break; }catch(e){} }
  const ext=blob&&blob.type==="image/webp"?"webp":blob&&blob.type==="image/gif"?"gif":"png", fname=`${TITLE().replace(/\s+/g,"")}_${r.combo}combo.${ext}`;
  if(blob){
    const file=new File([blob],fname,{type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]}) && matchMedia("(pointer:coarse)").matches){
      try{ await navigator.share({files:[file],title:TITLE(),text:`${MODE_NAME(r.mode)} · ${r.combo} COMBO ${url}`}); saved=true; }
      catch(e){ if(e&&e.name==="AbortError"){ toast(copied?"링크를 복사했어요":"공유를 취소했어요"); return; } }
    }
    if(!saved){
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000); saved=true;
    }
  }
  toast(copied&&saved?"링크를 복사하고 카드 이미지를 저장했어요" : copied?"링크를 복사했어요" : saved?"카드 이미지를 저장했어요":"공유에 실패했어요");
}
