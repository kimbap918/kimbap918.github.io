<script>
(function () {

  var OWNER_FLAG = "vc_owner";
  var NS = "kimbap918-github-io-main";
  var KEY_TOTAL = "visits";

  function todayKey() {
    var d = new Date();
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    return "visits-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  var KEY_DAILY = todayKey();

  try {
    var params = new URLSearchParams(location.search);
    if (params.get("vc") === OWNER_SECRET) {
      localStorage.setItem(OWNER_FLAG, "1");
      history.replaceState(null, "", location.pathname + location.hash);
    }
  } catch (e) {}

  var isOwner = false;
  try { isOwner = localStorage.getItem(OWNER_FLAG) === "1"; } catch (e) {}

  var alreadyCounted = false;
  try { alreadyCounted = sessionStorage.getItem("vc_counted") === "1"; } catch (e) {}

  var base = "https://abacus.jasoncameron.dev/";
  var mode = alreadyCounted ? "get/" : "hit/";

  Promise.all([
    fetch(base + mode + NS + "/" + KEY_DAILY).then(function (r) { return r.json(); }),
    fetch(base + mode + NS + "/" + KEY_TOTAL).then(function (r) { return r.json(); })
  ]).then(function (results) {
    if (!alreadyCounted) {
      try { sessionStorage.setItem("vc_counted", "1"); } catch (e) {}
    }
    var daily = results[0] && results[0].value;
    var total = results[1] && results[1].value;
    if (isOwner && typeof daily === "number" && typeof total === "number") {
      var el = document.createElement("div");
      el.textContent = "오늘 " + daily.toLocaleString() + " / 전체 " + total.toLocaleString();
      el.style.cssText = "position:fixed;right:10px;bottom:10px;background:rgba(0,0,0,0.7);color:#fff;font:12px/1.4 monospace;padding:5px 10px;border-radius:6px;z-index:99999;pointer-events:none;";
      document.body.appendChild(el);
    }
  }).catch(function () {});
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, get, remove, onDisconnect, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
(function () {
  if (window.top !== window.self) return;
  var firebaseConfig = {
    apiKey: "AIzaSyDlPJ9fYaOdsGlHDyXgyv_lgs3H0RAtZ2E",
    authDomain: "lataletkit-presence.firebaseapp.com",
    databaseURL: "https://lataletkit-presence-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "lataletkit-presence",
    storageBucket: "lataletkit-presence.firebasestorage.app",
    messagingSenderId: "849796620478",
    appId: "1:849796620478:web:75d646dbc423c17bd27eef"
  };
  var app = initializeApp(firebaseConfig);
  var db = getDatabase(app);
  var presenceRoot = ref(db, "presence");

  var clientId = "";
  try { clientId = localStorage.getItem("vc_client_id") || ""; } catch (e) {}
  if (!clientId) {
    clientId = Date.now().toString(36) + Math.random().toString(36).slice(2);
    try { localStorage.setItem("vc_client_id", clientId); } catch (e) {}
  }
  var myConnRef = push(ref(db, "presence/" + clientId));
  set(myConnRef, true).catch(function () {});
  onDisconnect(myConnRef).remove();
  window.addEventListener("pagehide", function () { remove(myConnRef).catch(function () {}); });

  // hub/index.html 하단 러너 목록 등록 - app.src.js가 idle/run 프레임을
  // 무기 제외 상태로 캡처해 넘겨주면(captureRunnerFrames) 여기서 Firebase
  // 쓰기만 담당한다. 같은 브라우저(clientId)로 다시 등록하면 기존 항목을
  // 덮어쓴다(장착 교체 = 갱신, 별개 러너로 쌓이지 않음).
  //
  // 예전엔 등록 인원이 20명을 넘으면 가장 오래된 걸 여기서 바로 지웠는데,
  // hub 쪽을 "표시 인원(PC 20/모바일 5)을 30분마다 무작위로 뽑아 보여주는"
  // 방식으로 바꾸면서(사용자 지정, 2026-08-21) 등록 자체는 지우지 않는다 -
  // "표시 안 되는 것"과 "삭제되는 것"을 분리했다. 무한정 쌓이는 건
  // hub/index.html의 관리자 패널(?vc=오너 시크릿)에서 직접 정리한다.
  function registerRunner(frames) {
    var myRef = ref(db, "runners/" + clientId);
    return get(myRef).then(function (mySnap) {
      var now = Date.now();
      return set(myRef, {
        createdAt: mySnap.exists() ? mySnap.val().createdAt : now,
        updatedAt: now,
        frames: frames,
      });
    });
  }

  function deleteMyRunner() {
    return remove(ref(db, "runners/" + clientId));
  }

  window.CharSimRunnerFirebase = { registerRunner: registerRunner, deleteMyRunner: deleteMyRunner };

  var isOwner = false;
  try { isOwner = localStorage.getItem("vc_owner") === "1"; } catch (e) {}
  if (!isOwner) return;

  var el = document.createElement("div");
  el.style.cssText = "position:fixed;right:10px;bottom:40px;background:rgba(0,0,0,0.7);color:#5f5;font:12px/1.4 monospace;padding:5px 10px;border-radius:6px;z-index:99999;pointer-events:none;";
  el.textContent = "실시간 -명";
  document.body.appendChild(el);

  onValue(presenceRoot, function (snap) {
    var n = snap.exists() ? Object.keys(snap.val()).length : 0;
    el.textContent = "실시간 " + n + "명";
  });
})();
</script>
