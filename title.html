<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>타이틀 검색기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 라이트모드 OS에서는 색이 있는 타이틀 텍스트가 밝은 배경 위에서 잘 안
   보인다 - PC에서 검증한 다크 배경이 원본 색 텍스트 가독성에 필수라,
   OS 설정과 무관하게 항상 다크로 고정한다(prefers-color-scheme 분기
   없음 - 의도적 단일 테마). */
/* 팔레트: kimbap918.github.io 허브와 동일 (dusty rose + 웜 뉴트럴).
   이 페이지는 색이 있는 타이틀 텍스트 가독성 때문에 다크 단일 테마 유지. */
:root{
  color-scheme: dark;
  --bg:#14171f;
  --panel:#1c2029;
  --card:#242a35;
  --border:#333a48;
  --border-strong:#3d4757;
  --text:#eef0f4;
  --muted:#9298a6;
  --accent:#e08aa2;
  --accent-ink:#1a1015;
  --accent-soft:#33262e;
  --home:#dd8a78;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
header{padding:16px 20px;border-bottom:1px solid var(--border);}
h1{font-size:18px;margin:0 0 6px;}
.lead{font-size:12px;color:var(--muted);margin:0 0 4px;max-width:70ch;}
#main{padding:16px 20px;max-width:920px;margin:0 auto;}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;}
.search-wrap{position:relative;flex:2 1 240px;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);pointer-events:none;}
#searchInput{padding-left:32px;}
input[type=text], select{
  padding:8px 12px;font-size:14px;border-radius:6px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);width:100%;font-family:inherit;
}
input[type=text]:focus, select:focus{outline:none;border-color:var(--accent);}
#statSelect{flex:1 1 200px;}
.small{color:var(--muted);font-size:12px;}
.meta-row{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px;font-size:12px;color:var(--muted);}
.meta-row b{color:var(--text);font-variant-numeric:tabular-nums;}

.title-list{display:flex;flex-direction:column;gap:6px;}
.title-row{
  border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--panel);
}
.title-row:hover{border-color:var(--accent);}
.title-row.lk-hl{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent);}
.title-row .row1 .lk-slot{margin-left:auto;}
.title-row .row1{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;}
.title-name{font-size:14px;font-weight:700;}
/* 상자 테두리만으로는 배경 자체가 어두운 계열이라 여전히 구분이 잘 안
   된다 - 글자 획 자체를 밝은 색으로 얇게 둘러서(네임플레이트 텍스트
   방식) 어떤 어두운 배경에서도 또렷하게 한다. */
.title-name.outline{
  text-shadow:
    -1px -1px 0 rgba(255,255,255,.85), 1px -1px 0 rgba(255,255,255,.85),
    -1px 1px 0 rgba(255,255,255,.85), 1px 1px 0 rgba(255,255,255,.85);
}
.title-desc{font-size:12px;color:var(--muted);margin-top:3px;}
.title-effect{font-size:11.5px;color:var(--accent);margin-top:5px;}
.stat-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.badge{
  font-size:11px;padding:2px 7px;border-radius:4px;background:var(--border);color:var(--text);
  font-variant-numeric:tabular-nums;
}
.badge b{font-weight:700;}
.badge.highlight{background:var(--accent);color:var(--accent-ink);}
.empty-state{color:var(--muted);font-size:13px;padding:30px 0;text-align:center;}

.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;flex-wrap:wrap;}
#paginationTop{margin-bottom:16px;}

@media (max-width:720px){
  #main{padding:14px;}
  /* flex-basis(240px/200px)는 가로 배치 기준으로 잡은 값인데,
     column 방향에서는 그게 세로(높이) 기준이 되어버려서 검색창이
     비정상적으로 길어지고 그 안의 아이콘이 멀리 떨어져 보인다 - 세로로
     쌓을 땐 flex-basis를 꺼서 자연스러운 높이로 되돌린다. */
  .controls{flex-direction:column;align-items:stretch;}
  .search-wrap, #statSelect{flex:none;width:100%;}
}

<script>

    document.body.appendChild(m);

    window.addEventListener("scroll",closeMenu,{once:true,capture:true});

  }

        u.searchParams.delete("vc");

    },
    clearParam:function(k){
      try{var u=new URL(location.href);u.searchParams.delete(k);

<style>

<script>
window.LKI18N=(function(){
  var LANGS=["ko","en","zh","ja"];
  var LABEL={ko:"한",en:"EN",zh:"中",ja:"日"};
  var FULL={ko:"한국어",en:"English",zh:"中文",ja:"日本語"};
  var strings={};
  var rules=[];   // [ [RegExp, {en,zh,ja}] ] — 게임 데이터에 섞인 구조적 토큰 부분치환용
  var cur="ko";
  var ATTRS=["placeholder","title","aria-label","alt"];
  var mo=null,tmr=null,host=null,applying=false;

  function norm(s){return (s||"").replace(/\s+/g," ").trim();}
  function hasKo(s){return /[가-힣]/.test(s||"");}
  function tr(ko){
    var e=strings[ko]||strings[norm(ko)];
    if(!e) return null;
    return (cur!=="ko" && e[cur]!=null) ? e[cur] : null;
  }
  function applyRules(s){
    if(cur==="ko"||!rules.length) return s;
    var out=s;
    for(var i=0;i<rules.length;i++){
      var rep=rules[i][1][cur];
      if(rep!=null) out=out.replace(rules[i][0],rep);
    }
    return out;
  }
  function skip(node){
    var p=node.nodeType===3?node.parentNode:node;
    if(!p||!p.nodeName) return true;
    var t=p.nodeName;
    if(t==="SCRIPT"||t==="STYLE"||t==="TEXTAREA"||t==="NOSCRIPT") return true;
    return !!(p.closest && p.closest("[data-noi18n],.lk-lang,.lk-menu,.lk-toast,.lk-sb"));
  }
  function walkText(root){
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    var n,list=[];
    while(n=w.nextNode()){
      if(skip(n)) continue;
      if(n.__ko!=null || hasKo(n.nodeValue)) list.push(n);
    }
    for(var i=0;i<list.length;i++){
      var node=list[i];
      if(node.__ko==null) node.__ko=node.nodeValue;
      var ko=node.__ko;
      if(cur==="ko"){ if(node.nodeValue!==ko) node.nodeValue=ko; continue; }
      var t=tr(norm(ko));
      if(t==null){
        var rv=applyRules(ko);
        if(node.nodeValue!==rv) node.nodeValue=rv;
        continue;
      }
      var lead=(ko.match(/^\s*/)||[""])[0], trail=(ko.match(/\s*$/)||[""])[0];
      var nv=lead+t+trail;
      if(node.nodeValue!==nv) node.nodeValue=nv;
    }
  }
  function walkAttrs(root){
    var els=root.querySelectorAll?root.querySelectorAll("*"):[];
    for(var i=0;i<els.length;i++){
      var el=els[i];
      if(el.closest && el.closest("[data-noi18n],.lk-lang")) continue;
      for(var a=0;a<ATTRS.length;a++){
        var name=ATTRS[a];
        if(!el.hasAttribute(name)) continue;

        if(el[key]==null) el[key]=el.getAttribute(name);
        var ko=el[key];
        if(!hasKo(ko)) continue;

  }
  function apply(){

  }
  function schedule(){ if(tmr) clearTimeout(tmr); tmr=setTimeout(apply,80); }
  function paintSwitcher(){
    if(!host) return;
    for(var i=0;i<host.children.length;i++){

  }
  function setLang(l){

  function buildSwitcher(){

  }
  // 8개 도구 공통 문구 (상단 탭 / 테마 토글 / 방문자 카운터 등)
  var COMMON={

    "경험치 인던 (beta)":{en:"EXP Dungeons (beta)",zh:"经验副本 (beta)",ja:"経験値ダンジョン (beta)"},
    "다크/라이트 모드 전환":{en:"Toggle dark / light mode",zh:"切换深色/浅色模式",ja:"ダーク/ライト切替"},
    "오늘":{en:"Today",zh:"今日",ja:"今日"},
    "실시간":{en:"Live",zh:"实时",ja:"リアルタイム"},
    "최근 업데이트":{en:"Last updated",zh:"最近更新",ja:"最終更新"},
    "공유":{en:"Share",zh:"分享",ja:"共有"},

    "이미지 저장":{en:"Save image",zh:"保存图片",ja:"画像を保存"},

    "이미지 저장됨":{en:"Image saved",zh:"已保存图片",ja:"画像を保存しました"}

    },

    lang:function(){ return cur; },

})();

const STAT_OPTIONS = META.searchOptions; // [{n: label, t: statusType}]
const STAT_NAMES = META.statusNames;     // {statusType: label}

function statLabel(type) {
  const opt = STAT_OPTIONS.find(o => o.t === type);
  if (opt) return opt.n;
  if (STAT_NAMES[type]) return STAT_NAMES[type];
  return `스탯#${type}`;
}

// 라벨 끝에 " %" / " +" / " +%" 같은 표기 힌트가 붙어 나온다.
// "물리/마법 크리티컬 확률 +%" + 6  →  "물리/마법 크리티컬 확률 6%"
// "최대 HP +" + 600                →  "최대 HP +600"
function trStat(name) {
  if (!window.LKI18N || LKI18N.lang() === "ko") return name;
  const e = window.LK_STAT && window.LK_STAT[name];
  const v = e && e[LKI18N.lang()];
  return v || name;
}
function fmtStat(type, val, bold) {
  const raw = String(statLabel(type)).trim();
  const pct = /[%％]/.test(raw);
  const name = trStat(raw.replace(/[%％+\-\s]+$/, "").trim());
  const v = val.toLocaleString();
  const vb = bold ? `<b>${v}</b>` : v;
  return pct ? `${name} ${vb}%` : `${name} +${vb}`;
}
/* 드롭다운(<option>)에 뜨는 스탯 라벨 전체 문자열을 사전으로 생성 → LKI18N 이 치환 */
(function () {
  if (!window.LKI18N || !window.LK_STAT) return;
  const m = {};
  (META.searchOptions || []).forEach(o => {
    const suf = (o.n.match(/[\s+%％]+$/) || [""])[0];
    const base = o.n.slice(0, o.n.length - suf.length).trim();
    const e = window.LK_STAT[base];
    if (e) m[o.n] = { en: e.en + suf, zh: e.zh + suf, ja: e.ja + suf };
  });
  LKI18N.add(m);
})();

// 원본 텍스트에 개행이 리터럴 "\n" 두 글자로 박혀있는 경우가 있어서,
// 실제 줄바꿈이든 리터럴 "\n"이든 전부 공백으로 접어 한 줄로 만든다
// (타이틀 설명은 원래 짧은 한 줄짜리 문구라 줄바꿈이 필요 없다).
function cleanText(s) {
  return (s || "").replace(/\\n/g, " ").replace(/\n/g, " ").replace(/\s+/g, " ").trim();
}

const CHOSUNG = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function toChosung(str) {
  let out = "";
  for (const ch of str) {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code >= 0 && code <= 11171) out += CHOSUNG[Math.floor(code / 588)];
    else out += ch;
  }
  return out;
}
function isChosungOnly(str) {
  return str.length > 0 && [...str].every(ch => CHOSUNG.includes(ch));
}

const PAGE_SIZE = 50;
let currentPage = 0;

// 결과가 페이지당 50개라 모바일에서는 스크롤을 한참 내려야 하단
// 페이지네이션이 나온다 - 같은 컨트롤을 목록 위/아래 두 군데에 똑같이
// 그려서 어디서든 바로 페이지를 넘길 수 있게 한다.
function buildPaginationInto(pgEl, totalItems, totalPages) {
  pgEl.innerHTML = "";
  if (totalPages <= 1) return;

  const goTo = (p) => { currentPage = Math.min(totalPages - 1, Math.max(0, p)); render(); window.scrollTo(0, 0); };

  const prevBtn = document.createElement("button");
  prevBtn.textContent = "‹ 이전";
  prevBtn.disabled = currentPage === 0;
  prevBtn.addEventListener("click", () => goTo(currentPage - 1));
  pgEl.appendChild(prevBtn);

  // 페이지가 많아지면(스탯 필터 없이 전체 919개 = 19페이지) 전부 다 보여주지
  // 않고 현재 페이지 주변 + 처음/끝만 남긴다.
  const pages = [];
  for (let p = 0; p < totalPages; p++) {
    if (p === 0 || p === totalPages - 1 || Math.abs(p - currentPage) <= 2) pages.push(p);
  }
  let lastShown = -1;
  for (const p of pages) {
    if (lastShown !== -1 && p - lastShown > 1) {
      const dots = document.createElement("span");
      dots.className = "pg-info";
      dots.textContent = "…";
      pgEl.appendChild(dots);
    }
    const btn = document.createElement("button");
    btn.textContent = String(p + 1);
    if (p === currentPage) btn.classList.add("active");
    btn.addEventListener("click", () => goTo(p));
    pgEl.appendChild(btn);
    lastShown = p;
  }

  const nextBtn = document.createElement("button");
  nextBtn.textContent = "다음 ›";
  nextBtn.disabled = currentPage >= totalPages - 1;
  nextBtn.addEventListener("click", () => goTo(currentPage + 1));
  pgEl.appendChild(nextBtn);

  // 페이지가 많을 때(스탯 필터 없이 전체 919개 = 19페이지) 버튼을 일일이
  // 눌러 넘기지 않고 바로 원하는 페이지로 뛸 수 있게 입력칸을 둔다.
  if (totalPages > 3) {
    const jumpWrap = document.createElement("span");
    jumpWrap.className = "pg-jump";

    const jumpInput = document.createElement("input");
    jumpInput.type = "number";
    jumpInput.min = "1";
    jumpInput.max = String(totalPages);
    jumpInput.className = "pg-jump-input";
    jumpInput.placeholder = String(currentPage + 1);
    jumpInput.setAttribute("aria-label", "이동할 페이지 번호");

    const jumpGo = () => {
      const v = parseInt(jumpInput.value, 10);
      if (v >= 1 && v <= totalPages) {
        goTo(v - 1);
      } else {
        jumpInput.value = "";
      }
    };
    const jumpBtn = document.createElement("button");
    jumpBtn.textContent = "이동";
    jumpBtn.addEventListener("click", jumpGo);
    jumpInput.addEventListener("keydown", (e) => { if (e.key === "Enter") jumpGo(); });

    const jumpLabel = document.createElement("span");
    jumpLabel.className = "pg-info";
    jumpLabel.textContent = `/ 총 ${totalPages}페이지`;

    jumpWrap.appendChild(jumpInput);
    jumpWrap.appendChild(jumpBtn);
    jumpWrap.appendChild(jumpLabel);
    pgEl.appendChild(jumpWrap);
  }
}

function renderPagination(totalItems) {
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  buildPaginationInto($("paginationTop"), totalItems, totalPages);
  buildPaginationInto($("pagination"), totalItems, totalPages);
}

function render() {
  const q = $("searchInput").value.trim();
  const qChosung = isChosungOnly(q);
  const statFilter = statSelect.value ? Number(statSelect.value) : null;

  let list = TITLES.filter(t => {
    if (statFilter !== null && !t.s.some(([type]) => type === statFilter)) return false;
    if (q) {
      const hay = t.n + " " + t.d;
      if (qChosung) {
        if (!toChosung(hay).includes(q)) return false;
      } else {
        if (!hay.toLowerCase().includes(q.toLowerCase())) return false;
      }
    }
    return true;
  });

  if (statFilter !== null) {
    list.sort((a, b) => {
      const av = a.s.find(([type]) => type === statFilter)?.[1] || 0;
      const bv = b.s.find(([type]) => type === statFilter)?.[1] || 0;
      return bv - av;
    });
  }

  $("resultCount").textContent = list.length.toLocaleString();
  const grid = $("resultGrid");
  grid.innerHTML = "";

  if (list.length === 0) {
    $("resultRangeOut").textContent = "0";
    grid.innerHTML = `<div class="empty-state">조건에 맞는 타이틀이 없습니다.</div>`;
    $("pagination").innerHTML = "";
    $("paginationTop").innerHTML = "";
    return;
  }

  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (currentPage > totalPages - 1) currentPage = totalPages - 1;
  const start = currentPage * PAGE_SIZE;
  const pageItems = list.slice(start, start + PAGE_SIZE);
  $("resultRangeOut").textContent = `${(start + 1).toLocaleString()}-${(start + pageItems.length).toLocaleString()}`;

  const frag = document.createDocumentFragment();
  pageItems.forEach(t => {
    const [r, g, b] = t.c;
    const statBadges = t.s.map(([type, val]) => {
      const hl = statFilter === type ? " highlight" : "";
      return `<span class="badge${hl}">${fmtStat(type, val, true)}</span>`;
    }).join("");
    const effectHtml = t.e.map(e => `<div class="title-effect">${cleanText(e)}</div>`).join("");
    const name = cleanText(t.n);
    const desc = cleanText(t.d);
    // 검정에 가까운 타이틀(19종)과, 증명의 탑/Survive·TimeAttack Master
    // 계열에 쓰인 짙은 남색(58,1,171)은 어두운 패널 위에서 글자 자체가
    // 거의 안 보인다. 배경 없이 원본 색을 그대로 유지하는 원칙을 지키면서,
    // 획에만 밝은 외곽선을 둘러 어두운 배경에서도 또렷하게 한다.
    const isDeepIndigo = r === 58 && g === 1 && b === 171;
    const isNearBlack = r + g + b < 30 || isDeepIndigo;
    const row = document.createElement("div");
    row.className = "title-row";
    row.dataset.id = t.id;
    row.innerHTML = `
      <div class="row1">
        <span class="title-name${isNearBlack ? " outline" : ""}" style="color:rgb(${r},${g},${b})">${name}</span>
        <span class="lk-slot"></span>
      </div>
      ${desc ? `<div class="title-desc">${desc}</div>` : ""}
      ${effectHtml}
      ${statBadges ? `<div class="stat-badges">${statBadges}</div>` : ""}
    `;
    const _slot = row.querySelector(".lk-slot");
    if (_slot && window.LKShare) {
      const _hex = isNearBlack ? "#8bd0ff"
        : "#" + [r, g, b].map(x => Math.max(0, Math.min(255, x)).toString(16).padStart(2, "0")).join("");
      LKShare.attach(_slot, () => ({
        page: "title.html", params: "t=" + t.id,
        title: name, subtitle: "라테일 타이틀", emoji: "🏷️", accent: _hex, quote: true,
        lines: t.s.slice(0, 3).map(([type, val]) => fmtStat(type, val, false))
      }), { captureEl: () => row });
    }
    frag.appendChild(row);
  });
  grid.appendChild(frag);
  renderPagination(list.length);
}

$("searchInput").addEventListener("input", () => { currentPage = 0; render(); });
statSelect.addEventListener("change", () => { currentPage = 0; render(); });

render();

/* 언어 전환 시 스탯 배지를 다시 그린다 */
document.addEventListener("click", (e) => {
  if (e.target.closest && e.target.closest(".lk-lang button")) setTimeout(() => { try { render(); } catch (_) {} }, 0);
});
document.addEventListener("DOMContentLoaded", () => setTimeout(() => { try { render(); } catch (_) {} }, 0));

/* 공유 링크로 진입 시 해당 타이틀로 이동·강조 (?t=<id>) */
(function () {
  try {
    var tp = new URLSearchParams(location.search).get("t");
    if (!tp) return;
    var tgt = TITLES.find(function (x) { return x.id === +tp; });
    if (!tgt) return;
    $("searchInput").value = cleanText(tgt.n);
    currentPage = 0;
    render();
    requestAnimationFrame(function () {
      var el = document.querySelector('.title-row[data-id="' + tgt.id + '"]');
      if (el) { el.classList.add("lk-hl"); el.scrollIntoView({ block: "center" }); }
    });
  } catch (e) {}
})();
</script>
